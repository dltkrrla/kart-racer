<style>

<script>
const CORE = (() => {
  const CTRL = [[0,0],[800,0],[1100,150],[1150,450],[950,650],[700,600],[550,750],[600,1000],[400,1150],[100,1100],[-50,900],[150,700],[100,450],[-200,400],[-300,150]];
  const HALF = 75, WALL = 120, SPACING = 8, KART_R = 13;
  const P = { MAX: 430, ACC: 300, BRK: 600, REV: 150, BOOST: 640, TURN: 2.5, DRIFT_TURN: 3.4, GRIP: 9, DRIFT_GRIP: 2.0, SMALL: 0.6, BIG: 1.4 };

  function buildTrack() {
    const SC = 1.3, n = CTRL.length, dense = [];
    for (let i = 0; i < n; i++) {
      const g = (q) => [CTRL[q][0] * SC, CTRL[q][1] * SC]; const p0 = g((i - 1 + n) % n), p1 = g(i), p2 = g((i + 1) % n), p3 = g((i + 2) % n);
      for (let k = 0; k < 40; k++) {
        const t = k / 40, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    const M = dense.length, dc = [0];
    for (let i = 1; i <= M; i++) { const a = dense[i - 1], b = dense[i % M]; dc.push(dc[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
    const total = dc[M], N = Math.round(total / SPACING);
    const xs = new Float64Array(N), ys = new Float64Array(N);
    let j = 0;
    for (let k = 0; k < N; k++) {
      const s = k * total / N;
      while (dc[j + 1] < s) j++;
      const a = dense[j], b = dense[(j + 1) % M], t = (s - dc[j]) / (dc[j + 1] - dc[j]);
      xs[k] = a[0] + (b[0] - a[0]) * t; ys[k] = a[1] + (b[1] - a[1]) * t;
    }
    const dx = new Float64Array(N), dy = new Float64Array(N), seg = new Float64Array(N), cum = new Float64Array(N + 1);
    for (let k = 0; k < N; k++) {
      const m = (k + 1) % N, l = Math.hypot(xs[m] - xs[k], ys[m] - ys[k]);
      dx[k] = (xs[m] - xs[k]) / l; dy[k] = (ys[m] - ys[k]) / l; seg[k] = l; cum[k + 1] = cum[k] + l;
    }
    return { N, xs, ys, dx, dy, seg, cum, L: cum[N] };
  }

  function nearest(T, x, y, hint) {
    let best = Infinity, bi = 0, bt = 0;
    const scan = (i) => {
      const ax = T.xs[i], ay = T.ys[i], l = T.seg[i];
      let t = (x - ax) * T.dx[i] + (y - ay) * T.dy[i];
      t = t < 0 ? 0 : t > l ? l : t;
      const cx = ax + T.dx[i] * t, cy = ay + T.dy[i] * t, d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < best) { best = d; bi = i; bt = t; }
    };
    if (hint < 0) for (let i = 0; i < T.N; i++) scan(i);
    else for (let o = -40; o <= 40; o++) scan((hint + o + T.N) % T.N);
    return { i: bi, s: T.cum[bi] + bt, cx: T.xs[bi] + T.dx[bi] * bt, cy: T.ys[bi] + T.dy[bi] * bt, dist: Math.sqrt(best) };
  }

  const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);

  function spawnPose(T, slot) {
    const back = 45 + Math.floor(slot / 2) * 50, lat = (slot % 2 ? 1 : -1) * 32;
    const dx = T.dx[0], dy = T.dy[0];
    return { x: T.xs[0] - dx * back - dy * lat, y: T.ys[0] - dy * back + dx * lat, a: Math.atan2(dy, dx) };
  }

  function resetKart(k, T, slot) {
    const p = spawnPose(T, slot);
    Object.assign(k, { x: p.x, y: p.y, a: p.a, vx: 0, vy: 0, speed: 0, drifting: false, charge: 0, boost: 0, off: false, rl: 0, fin: -1 });
    const n = nearest(T, k.x, k.y, -1); k.ti = n.i; k.s = n.s;
    return k;
  }
  const newKart = (T, slot) => resetKart({ maxMul: 1 }, T, slot);
  const progress = (k, T) => (k.rl - 1) * T.L + k.s;

  function stepKart(k, inp, dt, canDrive, T) {
    const steer = canDrive ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
    const brake = canDrive && inp.brake, gas = canDrive && inp.gas && !brake;
    const wantDrift = canDrive && inp.drift && steer !== 0 && k.speed > 180;
    if (wantDrift) { k.drifting = true; k.charge += dt; }
    else {
      if (k.drifting) { if (k.charge >= P.BIG) k.boost = 1.5; else if (k.charge >= P.SMALL) k.boost = 0.8; }
      k.drifting = false; k.charge = 0;
    }
    const maxS = P.MAX * k.maxMul * (k.off ? 0.45 : 1);
    if (k.boost > 0) { k.boost -= dt; k.speed = approach(k.speed, P.BOOST * (k.off ? 0.6 : 1), P.ACC * 3 * dt); }
    else if (gas) k.speed = approach(k.speed, maxS, (k.speed > maxS ? P.ACC * 1.5 : P.ACC) * dt);
    else if (brake) k.speed = approach(k.speed, -P.REV, P.BRK * dt);
    else k.speed = approach(k.speed, 0, P.ACC * (k.off ? 1.2 : 0.5) * dt);

    const tf = Math.min(1, Math.abs(k.speed) / 120) * Math.sign(k.speed);
    k.a = wrapA(k.a + steer * (k.drifting ? P.DRIFT_TURN : P.TURN) * tf * dt);
    const f = 1 - Math.exp(-(k.drifting ? P.DRIFT_GRIP : P.GRIP) * dt);
    k.vx += (Math.cos(k.a) * k.speed - k.vx) * f;
    k.vy += (Math.sin(k.a) * k.speed - k.vy) * f;
    k.x += k.vx * dt; k.y += k.vy * dt;

    const n = nearest(T, k.x, k.y, k.ti);
    k.ti = n.i; k.off = n.dist > HALF;
    if (n.dist > WALL - KART_R) {
      const nx = (k.x - n.cx) / n.dist, ny = (k.y - n.cy) / n.dist, lim = WALL - KART_R;
      k.x = n.cx + nx * lim; k.y = n.cy + ny * lim;
      const vn = k.vx * nx + k.vy * ny;
      if (vn > 0) {
        k.vx -= vn * nx * 1.3; k.vy -= vn * ny * 1.3;
        if (k.speed > 0) k.speed = Math.max(0, k.speed - vn * 0.9);
        k.hit = vn;
      }
      k.speed *= 0.995;
    }
    const ds = n.s - k.s;
    if (ds < -T.L / 2) k.rl++; else if (ds > T.L / 2) k.rl--;
    k.s = n.s;
  }

  function collide(a, b, moveB) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = KART_R * 2;
    if (d >= min || d < 0.001) return false;
    const nx = dx / d, ny = dy / d, ov = min - d;
    if (moveB) { a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2; b.speed *= 0.97; }
    else { a.x -= nx * ov; a.y -= ny * ov; }
    a.speed *= 0.97;
    return true;
  }

  function botInput(k, T, lane) {
    const look = 8 + Math.floor(Math.abs(k.speed) / 35);
    const j = (k.ti + look) % T.N;
    const tx = T.xs[j] - T.dy[j] * lane, ty = T.ys[j] + T.dx[j] * lane;
    const diff = wrapA(Math.atan2(ty - k.y, tx - k.x) - k.a);
    const j2 = (k.ti + look + 18) % T.N;
    const turn = Math.abs(wrapA(Math.atan2(T.dy[j2], T.dx[j2]) - Math.atan2(T.dy[k.ti], T.dx[k.ti])));
    const slow = turn > 0.9 && k.speed > 330;
    return { left: diff < -0.04, right: diff > 0.04, gas: !slow, brake: turn > 1.4 && k.speed > 300, drift: false };
  }

  return { HALF, WALL, KART_R, P, buildTrack, nearest, wrapA, spawnPose, resetKart, newKart, progress, stepKart, collide, botInput };
})();
if (typeof module !== 'undefined') module.exports = CORE;
</script>
<script>
// P2P 연결 (PeerJS). 방장 폰이 서버 역할: 참가자 상태를 모아 모두에게 다시 뿌림
const NET = (() => {
  const PREFIX = 'kartracer4p-v1-';
  const num = (v) => (typeof v === 'number' && isFinite(v)) ? v : 0;
  function sanitize(p) {
    if (!p || typeof p !== 'object') return Object.freeze({});
    const o = {
      n: typeof p.n === 'string' ? p.n.slice(0, 12) : '?', jt: num(p.jt), host: p.host === true, sl: num(p.sl),
      x: num(p.x), y: num(p.y), a: num(p.a), sp: num(p.sp), dr: p.dr ? 1 : 0, bo: p.bo ? 1 : 0,
      kt: p.kt === 'truck' ? 'truck' : 'dragon',
      rl: num(p.rl), s: num(p.s), fin: typeof p.fin === 'number' ? p.fin : -1, rid: typeof p.rid === 'string' ? p.rid.slice(0, 40) : null,
    };
    if (typeof p.hn === 'number') o.hn = p.hn;
    if (p.race && typeof p.race === 'object' && typeof p.race.id === 'string' && typeof p.race.start === 'number')
      o.race = { id: p.race.id.slice(0, 40), start: p.race.start, laps: Math.max(1, Math.min(9, num(p.race.laps) || 3)) };
    return Object.freeze(o);
  }

  const OPTS = { debug: 0, config: { iceServers: [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  ] } };

  function open(code, asHost, onClose, onStage) {
    onStage = onStage || (() => {});
    return new Promise((resolve, reject) => {
      onStage('연결 서버에 접속 중...');
      const peer = asHost ? new Peer(PREFIX + code, OPTS) : new Peer(OPTS);
      let peerOpened = false;
      const others = new Map(), conns = new Map();
      let mine = Object.freeze({}), mineAt = Date.now(), myId = 'me', hostConn = null, settled = false, closed = false;
      const fail = (msg) => { if (!settled) { settled = true; try { peer.destroy(); } catch (e) {} reject(new Error(msg)); } };
      const timer = setTimeout(() => fail(!peerOpened ? '연결 서버에 접속할 수 없어요. 인터넷 연결을 확인하세요'
        : '방장 폰과 직접 연결이 안 돼요. 둘 다 같은 와이파이에 연결해서 다시 해 보세요'), 20000);
      // 폰이 다른 앱(카톡 등)으로 갔다 오면 연결 서버와 끊기므로 자동으로 다시 붙음
      const revive = () => { try { if (!closed && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} };
      const onVis = () => { if (document.visibilityState === 'visible') revive(); };
      document.addEventListener('visibilitychange', onVis);
      const keep = setInterval(revive, 3000);
      peer.on('disconnected', () => setTimeout(revive, 500));
      const close = (msg) => { if (closed) return; closed = true; clearInterval(keep); document.removeEventListener('visibilitychange', onVis); try { peer.destroy(); } catch (e) {} if (settled) onClose(msg); };

      const api = {
        peers() {
          const list = [{ peer: myId, isMe: true, sameTab: true, kind: 'viewer', presence: mine, updatedAt: mineAt }];
          for (const [id, v] of others) list.push({ peer: id, isMe: false, sameTab: false, kind: 'viewer', presence: v.presence, updatedAt: v.updatedAt });
          return list;
        },
        async presence(patch) {
          const m = { ...mine };
          for (const k in patch) { if (patch[k] === null) delete m[k]; else m[k] = patch[k]; }
          mine = Object.freeze(m); mineAt = Date.now();
          if (asHost) {
            const list = [[myId, mine]];
            for (const [id, v] of others) list.push([id, v.presence]);
            for (const c of conns.values()) if (c.open) c.send({ t: 'w', list });
          } else if (hostConn && hostConn.open) hostConn.send({ t: 'st', p: mine });
        },
        async leave() { closed = true; clearInterval(keep); document.removeEventListener('visibilitychange', onVis); try { peer.destroy(); } catch (e) {} },
      };

      peer.on('error', (e) => {
        const t = e && e.type;
        if (settled) return; // 연결된 뒤의 서버 오류는 무시 (게임 데이터는 폰끼리 직접 오감)
        if (t === 'unavailable-id') fail('taken');
        else if (t === 'peer-unavailable') fail('방을 찾을 수 없어요. 코드가 맞는지, 방장이 게임 화면을 켜 두고 있는지 확인하세요');
        else if (t === 'browser-incompatible') fail('이 브라우저는 지원하지 않아요. 크롬이나 삼성 인터넷으로 열어 주세요');
        else fail('연결 실패 (' + (t || 'error') + ')');
      });

      if (asHost) {
        peer.on('open', (id) => { peerOpened = true; if (settled) return; myId = id; clearTimeout(timer); settled = true; resolve(api); });
        peer.on('connection', (conn) => {
          conn.on('open', () => {
            if (conns.size >= 3) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 400); return; }
            conns.set(conn.peer, conn);

          conn.on('data', (d) => { if (d && d.t === 'st' && conns.has(conn.peer)) others.set(conn.peer, { presence: sanitize(d.p), updatedAt: Date.now() }); });
          const drop = () => { conns.delete(conn.peer); others.delete(conn.peer); };
          conn.on('close', drop); conn.on('error', drop);
        });
      } else {
        peer.on('open', (id) => {
          peerOpened = true;
          if (hostConn) return; // 재접속 시 다시 연결하지 않음
          myId = id;
          onStage('방장 폰에 연결 중...');
          hostConn = peer.connect(PREFIX + code, { serialization: 'json' });
          hostConn.on('open', () => { clearTimeout(timer); settled = true; resolve(api); });
          hostConn.on('data', (d) => {
            if (!d || typeof d !== 'object') return;
            if (d.t === 'full') { fail('방이 가득 찼어요 (최대 4명)'); close('방이 가득 찼어요 (최대 4명)'); return; }
            if (d.t !== 'w' || !Array.isArray(d.list)) return;
            const seen = new Set(), t = Date.now();
            for (const item of d.list.slice(0, 4)) {
              if (!Array.isArray(item) || typeof item[0] !== 'string' || item[0] === myId) continue;
              seen.add(item[0]); others.set(item[0], { presence: sanitize(item[1]), updatedAt: t });
            }
            for (const k of [...others.keys()]) if (!seen.has(k)) others.delete(k);
          });
          hostConn.on('close', () => close('방장과 연결이 끊겼어요'));
          hostConn.on('error', () => close('방장과 연결이 끊겼어요'));
        });
      }
    });
  }
  return { open };
})();

<script>
// 효과음: 전부 Web Audio로 합성 (파일 없음)
const SFX = (() => {
  let ac = null, master, eng, scr, noiseBuf, muted = false;
  try { muted = localStorage.getItem('kart-mute') === '1'; } catch (e) {}
  const GEARS = [0, 110, 200, 290, 380, 470, 9999];

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 엔진: 톱니파 + 사각파 → 저역 필터
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), g2 = ac.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.Q.value = 3; g.gain.value = 0; g2.gain.value = 0.4;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
    eng = { o1, o2, f, g };
    // 타이어 스키드: 노이즈 → 대역 필터
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 5;
    const sg = ac.createGain(); sg.gain.value = 0; n.connect(bp); bp.connect(sg); sg.connect(master); n.start();
    scr = { sg, bp };
  }

  function update(speed, drifting, boosting, active) {
    if (!ac) return;
    const t = ac.currentTime, sp = Math.abs(speed);
    let gear = 0; while (sp > GEARS[gear + 1]) gear++;
    const lo = GEARS[gear], hi = Math.min(GEARS[gear + 1], 560);
    const rpm = Math.min(1, (sp - lo) / Math.max(1, hi - lo));
    const base = 48 + rpm * 95 + gear * 9 + (boosting ? 25 : 0);
    eng.o1.frequency.setTargetAtTime(base, t, 0.04);
    eng.o2.frequency.setTargetAtTime(base * 0.5, t, 0.04);
    eng.f.frequency.setTargetAtTime(500 + sp * 3.5 + (boosting ? 800 : 0), t, 0.08);
    eng.g.gain.setTargetAtTime(active && !muted ? 0.07 + 0.07 * Math.min(1, sp / 450) : 0, t, 0.12);
    scr.sg.gain.setTargetAtTime(active && !muted && drifting ? 0.07 : 0, t, 0.05);
    scr.bp.frequency.setTargetAtTime(1800 + sp * 2, t, 0.1);
  }

  function tone(freq, dur, type, vol) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, from, to, vol) {
    if (!ac || muted) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
    s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.5;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
  }
  return {
    init, update,
    beep: (hi) => tone(hi ? 880 : 440, hi ? 0.7 : 0.25, 'square', 0.1),
    boost: () => noise(0.9, 400, 3500, 0.35),
    hit: (v) => { tone(70, 0.25, 'sine', Math.min(0.5, v / 400)); noise(0.15, 800, 300, Math.min(0.3, v / 600)); },
    item: () => { tone(660, 0.12, 'triangle', 0.15); setTimeout(() => tone(990, 0.18, 'triangle', 0.15), 90); },
    lap: () => { tone(784, 0.15, 'triangle', 0.15); setTimeout(() => tone(1047, 0.3, 'triangle', 0.15), 140); },
    finish: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'triangle', 0.15), i * 150)),
    setMuted(m) { muted = m; try { localStorage.setItem('kart-mute', m ? '1' : '0'); } catch (e) {} },
    get muted() { return muted; },
  };
})();

    buildGrandstand(T.N - 70, 50, Wl + 60, true);

    // 광고판
    const ads = [['TURBO COLA', '#e63946', '#fff'], ['SPEED OIL', '#1d3557', '#ffd23f'], ['RACE FM 99.1', '#2a9d8f', '#fff'], ['KART GP', '#111', '#ffd23f'], ['NITRO TIRES', '#f77f00', '#fff'], ['BOOST ENERGY', '#7b2cbf', '#fff']];
    let placed = 0;
    for (let i = 30; i < T.N && placed < 14; i += 47) {
      if (Math.abs(kappa[i]) > 0.002) continue;
      const side = placed % 2 ? 1 : -1, off = side * (Wl + 14);
      const [x, z] = P(i, off);
      if (C.nearest(T, x, z, -1).dist < Wl + 5) continue;
      const ad = ads[placed % ads.length];
      const tex = canvasTex(512, 128, (g, w, h) => { g.fillStyle = ad[1]; g.fillRect(0, 0, w, h); g.fillStyle = ad[2]; g.font = 'bold 64px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ad[0], w / 2, h / 2 + 3); });
      const board = new THREE.Mesh(new THREE.PlaneGeometry(90, 22), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
      const nx = T.dy[i] * side, nz = -T.dx[i] * side; // 트랙 쪽을 향함
      board.position.set(x, 14, z); board.rotation.y = Math.atan2(nx, nz); scene.add(board);
      placed++;
    }

    // 나무
    const crownG = new THREE.ConeGeometry(1, 2.4, 7), trunkG = new THREE.CylinderGeometry(0.18, 0.22, 0.8, 6);
    const crowns = new THREE.InstancedMesh(crownG, new THREE.MeshLambertMaterial({ color: 0x2f7a30 }), treeList.length);
    const trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), treeList.length);
    const d = new THREE.Object3D(), col = new THREE.Color();
    treeList.forEach((t, i) => {
      d.position.set(t.x, t.r * 2.0, t.y); d.scale.set(t.r, t.r * (0.9 + (i % 5) * 0.08), t.r); d.rotation.set(0, i, 0); d.updateMatrix(); crowns.setMatrixAt(i, d.matrix);
      col.setHSL(0.3 + (i % 7) * 0.012, 0.5, 0.26 + (i % 4) * 0.025); crowns.setColorAt(i, col);
      d.position.set(t.x, t.r * 0.4, t.y); d.scale.set(t.r, t.r, t.r); d.updateMatrix(); trunks.setMatrixAt(i, d.matrix);
    });
    scene.add(crowns, trunks);

    // 먼 산
    const mtnMat = new THREE.MeshLambertMaterial({ color: 0x7ea08a, flatShading: true });
    for (let i = 0; i < 20; i++) {
      const a = i / 20 * Math.PI * 2, r = 3400 + (i % 3) * 300, hgt = 450 + ((i * 37) % 5) * 130;
      const m = new THREE.Mesh(new THREE.ConeGeometry(hgt * 1.4, hgt, 6), mtnMat);
      m.position.set(500 + Math.cos(a) * r, hgt / 2 - 20, 650 + Math.sin(a) * r); scene.add(m);
    }

    // 아이템 상자
    const qTex = canvasTex(64, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#ff5ad1'); gr.addColorStop(0.5, '#ffd23f'); gr.addColorStop(1, '#3fd2ff'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = 'bold 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', w / 2, h / 2 + 2); });
    const boxMat = new THREE.MeshLambertMaterial({ map: qTex, transparent: true, opacity: 0.92, emissive: 0x444444 });
    const boxG = new THREE.BoxGeometry(13, 13, 13);
    boxes = boxList.map((b) => { const m = new THREE.Mesh(boxG, boxMat); m.position.set(b.x, 14, b.y); m.castShadow = true; scene.add(m); return m; });

    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  }

  function buildGrandstand(i0, count, off, flip) {
    const len = count * 8, mid = i0 + Math.floor(count / 2);
    const [x, z] = P(mid, off), a = ang(mid);
    if (C.nearest(T, x, z, -1).dist < C.WALL + 20) return;
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = -a; scene.add(g);
    const s = flip ? 1 : -1; // 트랙에서 멀어지는 방향 (로컬 z)
    const concrete = new THREE.MeshLambertMaterial({ color: 0xb8bcc4 }), seat = new THREE.MeshLambertMaterial({ color: 0x2a5db0 });
    const crowdN = 7 * Math.floor(len / 7);
    const people = new THREE.InstancedMesh(new THREE.BoxGeometry(4, 7, 4), new THREE.MeshLambertMaterial(), crowdN);
    const d = new THREE.Object3D(), col = new THREE.Color(); let n = 0;
    for (let r = 0; r < 7; r++) {
      const step = new THREE.Mesh(new THREE.BoxGeometry(len, 6 + r * 6, 10), r % 2 ? seat : concrete);
      step.position.set(0, (6 + r * 6) / 2, s * (r * 10 + 5)); step.castShadow = step.receiveShadow = true; g.add(step);
      for (let k = 0; k < len / 7 && n < crowdN; k++) {
        if (Math.random() < 0.18) continue;
        d.position.set(-len / 2 + 4 + k * 7 + (Math.random() - 0.5) * 2, 6 + r * 6 + 3.5, s * (r * 10 + 5)); d.updateMatrix();
        people.setMatrixAt(n, d.matrix); col.setHSL(Math.random(), 0.65, 0.5); people.setColorAt(n, col); n++;
      }
    }
    people.count = n; g.add(people);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(len + 10, 3, 80), new THREE.MeshLambertMaterial({ color: 0xdedede }));
    roof.position.set(0, 64, s * 34); roof.castShadow = true; g.add(roof);
    for (const px of [-len / 2, 0, len / 2]) { const p = new THREE.Mesh(new THREE.BoxGeometry(3, 64, 3), concrete); p.position.set(px, 32, s * 72); g.add(p); }
  }

  // ---------- Kenney 3D 모델 (CC0) ----------
  const MODEL_FOR = { '#ff4d3d': 'red', '#8e5bd6': 'purple', '#ffc81e': 'yellow', '#26c35b': 'green' };
  let models = null, deco = null;
  function prepModel(root) {
    root.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true; o.receiveShadow = true;
        const m = o.material; if (m && m.map) { m.map.encoding = THREE.LinearEncoding; m.map.needsUpdate = true; }
      }
    });
    return root;
  }
  function loadModels(base) {
    if (!THREE.GLTFLoader) return Promise.resolve(false);
    const loader = new THREE.GLTFLoader();
    const get = (n) => new Promise((res) => loader.load(base + n + '.glb', (g) => res(prepModel(g.scene)), undefined, () => res(null)));
    return Promise.all(['red', 'purple', 'yellow', 'green'].map((c) => get('vehicle-truck-' + c)).concat([get('decoration-tents'), get('decoration-forest')]))
      .then((arr) => {
        if (arr.slice(0, 4).some((x) => !x)) return false;
        models = { red: arr[0], purple: arr[1], yellow: arr[2], green: arr[3] };
        deco = { tents: arr[4], forest: arr[5] };
        for (const [, v] of karts) scene.remove(v.g);
        karts.clear();
        placeDeco();
        return true;
      });
  }
  function placeDeco() {
    if (!deco) return;
    // 텐트(정비 구역) 몇 군데
    if (deco.tents) {
      let n = 0;
      for (let i = 60; i < T.N && n < 6; i += 131) {
        const side = n % 2 ? 1 : -1, [x, z] = P(i, side * (C.WALL + 95));
        if (C.nearest(T, x, z, -1).dist < C.WALL + 70) continue;
        const t = deco.tents.clone(true); t.scale.setScalar(13); t.position.set(x, 0, z); t.rotation.y = -ang(i) + (side > 0 ? Math.PI : 0); scene.add(t); n++;
      }
    }
  }

  function makeKartModel(color) {
    const src = models && models[MODEL_FOR[color]];
    if (!src) return null;
    const g = new THREE.Group();
    const body = new THREE.Group(); g.add(body);
    const m = src.clone(true); m.scale.setScalar(12); m.rotation.y = Math.PI / 2; body.add(m);
    const wheels = [], fronts = [];
    m.traverse((o) => {
      if (/^wheel/.test(o.name)) { o.rotation.order = 'YXZ'; wheels.push(o); if (/front/.test(o.name)) fronts.push(o); }
    });
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x66d0ff, transparent: true, opacity: 0.9 });
    const flameG = new THREE.ConeGeometry(2.8, 16, 10); flameG.rotateZ(Math.PI / 2);
    const flames = [4, -4].map((z) => { const f = new THREE.Mesh(flameG, flameMat); f.position.set(-25, 8, z); g.add(f); return f; });
    scene.add(g);
    return { g, body, wheels, fronts, flames, flameMat, model: true, prevA: null, prevSp: 0, spin: 0, roll: 0, pitch: 0, steer: 0, lastL: null, lastR: null, smokeT: 0 };
  }


  // ---------- 드래곤 카트 (오리지널 디자인) ----------
  function shade(hex, f) { const c = new THREE.Color(hex); return f >= 0 ? c.lerp(new THREE.Color(0xffffff), f) : c.multiplyScalar(1 + f); }
  function makeDragon(color) {
    const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
    const main = new THREE.MeshLambertMaterial({ color: shade(color, -0.05) });
    const darkM = new THREE.MeshLambertMaterial({ color: shade(color, -0.35) });
    const belly = new THREE.MeshLambertMaterial({ color: shade(color, 0.55) });
    const wingM = new THREE.MeshLambertMaterial({ color: shade(color, -0.2), side: THREE.DoubleSide });
    const white = new THREE.MeshLambertMaterial({ color: 0xffffff }), black = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const horn = new THREE.MeshLambertMaterial({ color: 0x5a5560 }), mouth = new THREE.MeshLambertMaterial({ color: 0x5a1a1a });
    const iris = new THREE.MeshLambertMaterial({ color: shade(color, -0.1) });
    const chassis = new THREE.MeshLambertMaterial({ color: 0x1b1b1d }), metal = new THREE.MeshLambertMaterial({ color: 0x9aa0a8 });
    const sph = new THREE.SphereGeometry(1, 16, 12);
    const blob = (mat, x, y, z, sx, sy, sz, parent) => { const m = new THREE.Mesh(sph, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; (parent || body).add(m); return m; };
    const cone = (mat, r0, h, x, y, z, rx, rz, parent) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r0, h, 7), mat); m.position.set(x, y, z); m.rotation.set(rx || 0, 0, rz || 0); m.castShadow = true; (parent || body).add(m); return m; };

    // 섀시 + 바퀴
    const ch = new THREE.Mesh(new THREE.BoxGeometry(32, 2, 18), chassis); ch.position.y = 4; g.add(ch);
    const tireG = new THREE.CylinderGeometry(5, 5, 5.5, 16); tireG.rotateX(Math.PI / 2);
    const rimG = new THREE.CylinderGeometry(2.6, 2.6, 5.8, 8); rimG.rotateX(Math.PI / 2);
    const wheels = [], fronts = [];
    for (const [x, z, front] of [[12, 11, 1], [12, -11, 1], [-12, 12, 0], [-12, -12, 0]]) {
      const pivot = new THREE.Group(); pivot.position.set(x, 5, z); g.add(pivot);
      const spin = new THREE.Group(); pivot.add(spin);
      const t = new THREE.Mesh(tireG, chassis); t.castShadow = true; spin.add(t); spin.add(new THREE.Mesh(rimG, metal));
      spin.add(new THREE.Mesh(new THREE.BoxGeometry(4.4, 1, 6), metal));
      wheels.push(spin); if (front) fronts.push(pivot);
    }
    // 몸통, 배
    blob(main, 0, 10, 0, 19, 8, 11);
    blob(belly, 2, 7.5, 0, 16, 5.5, 9.5);
    // 등 가시
    for (let x = 13; x >= -15; x -= 4) cone(darkM, 1.7, 5.5, x, 10 + 8 * Math.sqrt(Math.max(0, 1 - (x / 20) ** 2)) + 1.5, 0, 0, 0.45);
    // 목 + 머리
    blob(main, 15, 13, 0, 7, 6, 7);
    const head = new THREE.Group(); head.position.set(22, 15, 0); body.add(head);
    blob(main, 0, 0, 0, 7.5, 6, 7, head);
    blob(main, 6.5, -1, 0, 6.5, 3.6, 5, head);                 // 주둥이
    blob(mouth, 6, -3.2, 0, 5.6, 1.6, 4, head);                  // 입 안
    blob(belly, 5.5, -5, 0, 6, 1.8, 4.3, head);                  // 아래턱
    for (let i = 0; i < 4; i++) for (const s of [1, -1]) {
      cone(white, 0.7, 2, 4 + i * 2.1, -3.1, s * 2.9, Math.PI, 0, head);        // 윗니
      if (i % 2) cone(white, 0.6, 1.6, 4.5 + i * 2, -4.3, s * 2.6, 0, 0, head); // 아랫니
    }
    for (const s of [1, -1]) {
      blob(white, 3.6, 2.2, s * 3.6, 2.4, 2.4, 2, head);         // 눈
      blob(iris, 5.2, 2.0, s * 4.2, 1.3, 1.5, 1, head);
      blob(black, 5.9, 2.0, s * 4.5, 0.6, 0.9, 0.6, head);
      const brow = new THREE.Mesh(new THREE.BoxGeometry(6, 1.6, 2.6), darkM); brow.position.set(3.6, 4.6, s * 3.4); brow.rotation.set(0, 0, -0.35); head.add(brow);
      const h = cone(horn, 1.5, 9, -2.5, 5.5, s * 3, s * 0.35, 1.1, head);         // 뿔
      for (let k = 0; k < 3; k++) cone(darkM, 1.3, 4, -1.5 - k * 2.2, 6.5 - k * 0.4, 0, 0, 0.6, head); // 머리 볏
    }
    // 날개
    const ws = new THREE.Shape();
    ws.moveTo(0, 0); ws.lineTo(4, 14); ws.lineTo(12, 26); ws.lineTo(13, 16); ws.lineTo(19, 21); ws.lineTo(19, 10); ws.lineTo(26, 11); ws.lineTo(22, 1); ws.lineTo(0, 0);
    const wg = new THREE.ShapeGeometry(ws);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(wg), new THREE.LineBasicMaterial({ color: 0x2a1010 }));
    const wings = [1, -1].map((s) => {
      const pivot = new THREE.Group(); pivot.position.set(3, 16, s * 6); body.add(pivot);
      const m = new THREE.Mesh(wg, wingM); m.rotation.x = s * Math.PI / 2; m.scale.x = -1; m.castShadow = true; pivot.add(m);
      const e = edges.clone(); e.rotation.copy(m.rotation); e.scale.copy(m.scale); pivot.add(e);
      for (const [bx, by] of [[12, 26], [19, 21], [26, 11]]) { // 날개 뼈
        const d = new THREE.Vector3(-bx, 0.3, s * by), len = d.length();
        const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.7, len, 5), darkM);
        bone.position.copy(d).multiplyScalar(0.5);
        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
        pivot.add(bone);
      }
      cone(horn, 1, 3.5, 0, 1.5, s * 0.5, 0, 0, pivot); // 날개 발톱
      return { pivot, s };
    });
    // 꼬리 (관절 체인)
    const tail = []; let parent = new THREE.Group(); parent.position.set(-17, 10, 0); body.add(parent);
    for (let i = 0; i < 5; i++) {
      const seg = new THREE.Group(); seg.position.set(i === 0 ? 0 : -3.6, i === 0 ? 0 : 1.6, 0); seg.rotation.z = i ? 0.12 : 0; parent.add(seg);
      const r0 = 4.6 * (1 - i / 6.5);
      blob(main, -2.5, 0, 0, r0 * 1.2, r0, r0, seg);
      if (i % 2 === 0) cone(darkM, 1.2, 3.5, -2.5, r0 + 1, 0, 0, 0.5, seg);
      tail.push(seg); parent = seg;
    }
    const tip = cone(darkM, 2.2, 5, -4.5, 0.5, 0, 0, Math.PI / 2, parent);
    // 입에서 나오는 불 (부스터)
    const fireO = new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.85 });
    const fireY = new THREE.MeshBasicMaterial({ color: 0xffe14a, transparent: true, opacity: 0.95 });
    const fg = new THREE.ConeGeometry(4.5, 26, 10); fg.rotateZ(Math.PI / 2); fg.translate(13, 0, 0);
    const fg2 = new THREE.ConeGeometry(2.4, 18, 8); fg2.rotateZ(Math.PI / 2); fg2.translate(9, 0, 0);
    const fire = new THREE.Group(); fire.position.set(12, -3, 0); head.add(fire);
    fire.add(new THREE.Mesh(fg, fireO)); fire.add(new THREE.Mesh(fg2, fireY));
    scene.add(g);
    return { g, body, wheels, fronts, flames: [fire], flameMat: fireO, dragon: { wings, tail, head }, prevA: null, prevSp: 0, spin: 0, roll: 0, pitch: 0, steer: 0, lastL: null, lastR: null, smokeT: 0, flap: Math.random() * 6 };
  }

  function makeKart(color, type) {
    if (type === 'dragon') return makeDragon(color);
    const fromModel = makeKartModel(color);
    if (fromModel) return fromModel;
    const g = new THREE.Group();
    const paint = new THREE.MeshLambertMaterial({ color });
    const dark = new THREE.MeshLambertMaterial({ color: 0x1b1b1d });
    const metal = new THREE.MeshLambertMaterial({ color: 0x9aa0a8 });
    const body = new THREE.Group(); g.add(body);
    const add = (geo, mat, x, y, z, parent, rx, ry, rz) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0); m.castShadow = true; (parent || body).add(m); return m; };
    add(new THREE.BoxGeometry(34, 2, 18), dark, 0, 4, 0);                         // 섀시
    add(new THREE.BoxGeometry(14, 5, 12), paint, 16, 6.5, 0);                     // 노즈
    add(new THREE.BoxGeometry(8, 4, 20), paint, 21, 5, 0, null, 0, 0, -0.25);     // 프런트 카울
    add(new THREE.BoxGeometry(3, 3, 24), dark, 26, 4, 0);                         // 앞 범퍼
    add(new THREE.BoxGeometry(16, 5, 4), paint, 0, 6.5, 10);                      // 사이드 포드
    add(new THREE.BoxGeometry(16, 5, 4), paint, 0, 6.5, -10);
    add(new THREE.BoxGeometry(3, 3, 26), dark, -20, 4, 0);                        // 뒤 범퍼
    add(new THREE.BoxGeometry(8, 7, 10), metal, -14, 8.5, 0);                     // 엔진
    add(new THREE.CylinderGeometry(1.2, 1.2, 8, 8), metal, -19, 11, 3, null, 0, 0, Math.PI / 2 - 0.3); // 배기관
    add(new THREE.BoxGeometry(3, 12, 13), dark, -7.5, 11, 0);                     // 시트
    add(new THREE.BoxGeometry(5, 3, 26), paint, -21, 17, 0);                      // 리어 윙
    add(new THREE.BoxGeometry(2, 9, 2), dark, -21, 12, 9); add(new THREE.BoxGeometry(2, 9, 2), dark, -21, 12, -9);
    const plate = canvasTex(64, 64, (c, w) => { c.fillStyle = '#fff'; c.fillRect(0, 0, w, w); c.fillStyle = '#111'; c.font = 'bold 44px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(1 + karts.size % 9), w / 2, w / 2 + 2); });
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: plate })); pl.position.set(18, 9.1, 0); pl.rotation.set(-Math.PI / 2, 0, -Math.PI / 2); body.add(pl);
    // 드라이버
    add(new THREE.BoxGeometry(7, 9, 9), paint, -3, 13, 0);                        // 몸통
    add(new THREE.BoxGeometry(9, 2.4, 2.4), paint, 1.5, 14.5, 4.2, null, 0, 0, -0.35); // 팔
    add(new THREE.BoxGeometry(9, 2.4, 2.4), paint, 1.5, 14.5, -4.2, null, 0, 0, -0.35);
    add(new THREE.TorusGeometry(3.2, 0.7, 6, 14), dark, 5.5, 14, 0, null, 0, Math.PI / 2, 0.5); // 핸들
    add(new THREE.SphereGeometry(5.3, 14, 12), paint, -3, 21.5, 0);               // 헬멧
    add(new THREE.BoxGeometry(2, 3, 7.5), new THREE.MeshLambertMaterial({ color: 0x222c3a }), 1.9, 22, 0); // 바이저
    add(new THREE.BoxGeometry(1, 1.4, 10.8), new THREE.MeshLambertMaterial({ color: 0xffffff }), -3, 24.2, 0); // 헬멧 줄무늬
    // 바퀴
    const tireG = new THREE.CylinderGeometry(5, 5, 5.5, 16); tireG.rotateX(Math.PI / 2);
    const rimG = new THREE.CylinderGeometry(2.6, 2.6, 5.8, 8); rimG.rotateX(Math.PI / 2);
    const wheels = [], fronts = [];
    for (const [x, z, front] of [[12, 11, 1], [12, -11, 1], [-12, 12, 0], [-12, -12, 0]]) {
      const pivot = new THREE.Group(); pivot.position.set(x, 5, z); g.add(pivot);
      const spin = new THREE.Group(); pivot.add(spin);
      const t = new THREE.Mesh(tireG, dark); t.castShadow = true; spin.add(t);
      const r = new THREE.Mesh(rimG, metal); spin.add(r);
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1, 6), metal); spin.add(spoke);
      wheels.push(spin); if (front) fronts.push(pivot);
    }
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x66d0ff, transparent: true, opacity: 0.9 });
    const flameG = new THREE.ConeGeometry(2.8, 16, 10); flameG.rotateZ(Math.PI / 2);
    const flames = [3, -3].map((z) => { const f = new THREE.Mesh(flameG, flameMat); f.position.set(-28, 11, z); g.add(f); return f; });
    scene.add(g);
    return { g, body, wheels, fronts, flames, flameMat, prevA: null, prevSp: 0, spin: 0, roll: 0, pitch: 0, steer: 0, lastL: null, lastR: null, smokeT: 0 };
  }

  const local = (k, lx, lz) => [k.x + lx * Math.cos(k.a) - lz * Math.sin(k.a), k.y + lx * Math.sin(k.a) + lz * Math.cos(k.a)];

  function syncKarts(list, time, dt) {
    const seen = new Set();
    for (const it of list) {
      seen.add(it.id);
      let v = karts.get(it.id);
      const key = it.color + '|' + (it.type || 'truck');
      if (!v || v.key !== key) { if (v) scene.remove(v.g); v = makeKart(it.color, it.type); v.key = key; v.color = it.color; karts.set(it.id, v); }
      const k = it.k, sp = k.speed || 0;
      v.g.position.set(k.x, 0, k.y);
      v.g.rotation.y = -k.a;
      // 회전 속도 → 앞바퀴 조향, 차체 기울기
      const yaw = v.prevA == null || dt <= 0 ? 0 : C.wrapA(k.a - v.prevA) / dt;
      const acc = dt > 0 ? (sp - v.prevSp) / dt : 0;

    for (const x of racers()) if (x.fin < 0) lead = Math.max(lead, x.prog);
  }
  for (const k of all) {
    const base = k.baseMul || 1;
    const inIt = k === me ? inRace() : true;
    if (racing && inIt && k.fin < 0 && lead > -Infinity) {
      const gap = Math.max(0, lead - C.progress(k, T));
      k.maxMul = base * (1 + Math.min(1, gap / 1600) * 0.14);
    } else k.maxMul = base;
    // 슬립스트림: 앞 카트 바로 뒤를 1초 따라가면 부스터
    let behind = false;
    if (k.speed > 250) {
      const fx = Math.cos(k.a), fy = Math.sin(k.a);
      for (const o of all.concat(remoteKs)) {
        if (o === k) continue;
        const dx = o.x - k.x, dy = o.y - k.y, d = Math.hypot(dx, dy);
        if (d > 28 && d < 170 && (dx * fx + dy * fy) / d > 0.96) { behind = true; break; }
      }
    }
    k.draft = behind ? (k.draft || 0) + dt : Math.max(0, (k.draft || 0) - dt * 2);
    if (k.draft >= 1.0) { k.draft = 0; k.boost = Math.max(k.boost, 0.9); if (k === me) flashMsg('💨 슬립스트림!'); }
  }
  // 아이템 상자
  const t = Date.now();
  boxes.forEach((b, i) => {
    if (!boxActive[i]) { if (t > b.back) boxActive[i] = true; return; }
    if (me && Math.hypot(me.x - b.x, me.y - b.y) < 24) {
      boxActive[i] = false; b.back = t + 3000;
      if ((me.items || 0) < 2) { me.items = (me.items || 0) + 1; flashMsg('🚀 부스터 획득!'); SFX.item(); }
    }
    for (const bt of bots) if (boxActive[i] && Math.hypot(bt.x - b.x, bt.y - b.y) < 24) { boxActive[i] = false; b.back = t + 3000; bt.boost = Math.max(bt.boost, 1.0); }
  });
}

function simulate(dt) {
  if (!me) return;
  catchUp(dt);
  const steps = Math.min(12, Math.ceil(dt / STEP)), h = dt / steps;
  for (let s = 0; s < steps; s++) {
    me.hit = 0; C.stepKart(me, input, h, canDrive(me), T);
    if (me.hit > 90) { R3D.hit(me.hit); SFX.hit(me.hit); }
    for (const b of bots) C.stepKart(b, C.botInput(b, T, b.lane), h, canDrive(b), T);
    for (const b of bots) C.collide(me, b, true);
    for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) C.collide(bots[i], bots[j], true);
    for (const r of remotes.values()) C.collide(me, r, false);
  }
  if (race && now() >= race.start) {
    const t = now() - race.start;
    if (inRace() && me.fin < 0 && C.progress(me, T) >= race.laps * T.L) { me.fin = t; sendPresence(true); }
    if (inRace() || mode === 'solo') {
      if (me.rl > prevRl && prevRl >= 1) {
        const lt = t - lapStart; lapStart = t;
        if (bestLap == null || lt < bestLap) bestLap = lt;
        if (me.fin < 0) { SFX.lap(); flashMsg(me.rl === race.laps ? '🏁 마지막 바퀴!' : 'LAP ' + prevRl + '  ' + fmt(lt), 1600); }
      }
      if (me.rl > prevRl) prevRl = me.rl;
      if (me.fin >= 0 && !finSounded) { finSounded = true; SFX.finish(); }
    }
    for (const b of bots) if (b.fin < 0 && C.progress(b, T) >= race.laps * T.L) b.fin = t;
  }
  // remote display smoothing with short extrapolation
  const k = 1 - Math.exp(-14 * dt);
  for (const r of remotes.values()) {
    const q = r.pres; const age = Math.min(0.25, (Date.now() - r.recv) / 1000);
    const tx = q.x + Math.cos(q.a) * q.sp * age, ty = q.y + Math.sin(q.a) * q.sp * age;
    if (Math.hypot(tx - r.x, ty - r.y) > 300) { r.x = tx; r.y = ty; r.a = q.a; }
    r.x += (tx - r.x) * k; r.y += (ty - r.y) * k; r.a += C.wrapA(q.a - r.a) * k;
    r.drifting = !!q.dr; r.boost = q.bo ? 1 : 0; r.speed = q.sp;
  }
}

// ---------- rendering ----------
function resizeOv() { const dpr = Math.min(2, devicePixelRatio || 1); ov.width = Math.round(innerWidth * dpr); ov.height = Math.round(innerHeight * dpr); }
addEventListener('resize', resizeOv); resizeOv();

function setView(v) {
  view = v; try { localStorage.setItem('kart-view', v); } catch (e) {}
  const gl = document.getElementById('gl'); if (gl) gl.style.visibility = v === '3d' ? 'visible' : 'hidden';
  $('viewBtn2').textContent = v === '3d' ? '2D로' : '3D로'; $('viewMenu').textContent = '화면: ' + (v === '3d' ? '3D' : '2D') + ' (눌러서 바꾸기)';
}
$('viewBtn2').onclick = () => setView(view === '3d' ? '2d' : '3d');
$('viewMenu').onclick = () => setView(view === '3d' ? '2d' : '3d');
const typeLabel = () => { $('typeMenu').textContent = '차량: ' + (kartType === 'dragon' ? '🐉 드래곤 카트' : '🛻 레이싱 트럭') + ' (눌러서 바꾸기)'; };
$('typeMenu').onclick = () => { kartType = kartType === 'dragon' ? 'truck' : 'dragon'; try { localStorage.setItem('kart-type', kartType); } catch (e) {} typeLabel(); };
typeLabel();
setView(view);

function drawKart(k, color, name, type) {
  octx.save(); octx.translate(k.x, k.y); octx.rotate(k.a);
  if (type === 'dragon') {
    const flap = Math.sin(clockT * 10 + k.x * 0.01) * 4;
    octx.fillStyle = 'rgba(0,0,0,.25)'; octx.beginPath(); octx.ellipse(1, 2, 20, 12, 0, 0, 7); octx.fill();
    octx.fillStyle = color; octx.strokeStyle = '#2a1010'; octx.lineWidth = 1.2;
    for (const s of [1, -1]) { octx.beginPath(); octx.moveTo(4, s * 6); octx.lineTo(-8, s * (24 + flap)); octx.lineTo(-6, s * 15); octx.lineTo(-14, s * (19 + flap)); octx.lineTo(-12, s * 9); octx.closePath(); octx.globalAlpha = 0.85; octx.fill(); octx.globalAlpha = 1; octx.stroke(); }
    octx.beginPath(); octx.moveTo(-14, 0); octx.quadraticCurveTo(-26, Math.sin(clockT * 6) * 6, -34, 0); octx.lineWidth = 4; octx.strokeStyle = color; octx.stroke();
    octx.lineWidth = 1.2; octx.strokeStyle = '#2a1010';
    octx.beginPath(); octx.ellipse(0, 0, 16, 8, 0, 0, 7); octx.fill(); octx.stroke();
    octx.beginPath(); octx.ellipse(16, 0, 7, 6, 0, 0, 7); octx.fill(); octx.stroke();
    octx.fillStyle = '#fff'; for (const s of [1, -1]) { octx.beginPath(); octx.arc(18, s * 3.4, 2, 0, 7); octx.fill(); }
    octx.fillStyle = '#5a5560'; for (const s of [1, -1]) { octx.beginPath(); octx.moveTo(12, s * 3); octx.lineTo(6, s * 8); octx.lineTo(13, s * 5); octx.fill(); }
    if (k.boost > 0) { octx.fillStyle = 'rgba(255,140,30,.9)'; octx.beginPath(); octx.moveTo(22, -4); octx.lineTo(36 + Math.random() * 10, 0); octx.lineTo(22, 4); octx.fill(); }
    if (k.drifting) { octx.fillStyle = (k.charge || 0) >= C.P.BIG ? '#ff7a1a' : (k.charge || 0) >= C.P.SMALL ? '#ffd23f' : '#ddd'; for (const y of [-9, 9]) { octx.beginPath(); octx.arc(-14 - Math.random() * 6, y, 3 + Math.random() * 2, 0, 7); octx.fill(); } }
    octx.restore(); return;
  }
  if (k.boost > 0) { octx.fillStyle = 'rgba(80,180,255,.8)'; octx.beginPath(); octx.moveTo(-17, -6); octx.lineTo(-34 - Math.random() * 10, 0); octx.lineTo(-17, 6); octx.fill(); }
  if (k.drifting) { octx.fillStyle = (k.charge || 0) >= C.P.BIG ? '#ff7a1a' : (k.charge || 0) >= C.P.SMALL ? '#ffd23f' : '#ddd';
    for (const y of [-11, 11]) { octx.beginPath(); octx.arc(-15 - Math.random() * 6, y, 3 + Math.random() * 2, 0, 7); octx.fill(); } }
  octx.fillStyle = 'rgba(0,0,0,.25)'; octx.fillRect(-15, -11, 34, 24);
  octx.fillStyle = '#1c1c1c';
  for (const [x, y] of [[-10, -12], [-10, 8], [8, -11], [8, 7]]) octx.fillRect(x, y, 8, 4);
  octx.fillStyle = color; octx.beginPath(); octx.roundRect ? octx.roundRect(-16, -9, 33, 18, 6) : octx.rect(-16, -9, 33, 18); octx.fill();
  octx.fillStyle = 'rgba(255,255,255,.35)'; octx.fillRect(6, -6, 9, 12);
  octx.fillStyle = '#ffe0c2'; octx.beginPath(); octx.arc(-3, 0, 6.5, 0, 7); octx.fill();
  octx.fillStyle = color; octx.beginPath(); octx.arc(-4, 0, 6.5, Math.PI * 0.5, Math.PI * 1.5); octx.fill();
  octx.restore();
}

function draw2D(dt) {
  const W = ov.width, H = ov.height, dpr = W / innerWidth;
  const scale = Math.min(innerWidth, innerHeight) / 540 * dpr;
  let tx, ty, ta;
  if (me) { tx = me.x; ty = me.y; ta = me.a; }
  else { menuT += dt * 0.15; tx = (minX + maxX) / 2 + Math.cos(menuT) * 300; ty = (minY + maxY) / 2 + Math.sin(menuT) * 300; ta = menuT + Math.PI / 2; }
  const kk = 1 - Math.exp(-5 * dt);
  camA += C.wrapA(ta - camA) * kk; camX = tx; camY = ty;

  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = '#4c9a45'; octx.fillRect(0, 0, W, H);
  octx.setTransform(1, 0, 0, 1, W / 2, H * (me ? 0.66 : 0.5));
  octx.scale(scale, scale); octx.rotate(-camA - Math.PI / 2); octx.translate(-camX, -camY);

  octx.lineJoin = 'round'; octx.lineCap = 'round';
  octx.strokeStyle = '#2a2a2a'; octx.lineWidth = C.WALL * 2 + 16; octx.stroke(trackPath);
  octx.strokeStyle = '#d9c38a'; octx.lineWidth = C.WALL * 2; octx.stroke(trackPath);
  octx.strokeStyle = '#fff'; octx.lineWidth = C.HALF * 2 + 14; octx.stroke(trackPath);
  octx.setLineDash([24, 24]); octx.strokeStyle = '#e0352b'; octx.stroke(trackPath); octx.setLineDash([]);
  octx.strokeStyle = '#5b5d63'; octx.lineWidth = C.HALF * 2; octx.stroke(trackPath);
  octx.setLineDash([30, 40]); octx.strokeStyle = 'rgba(255,255,255,.35)'; octx.lineWidth = 3; octx.stroke(trackPath); octx.setLineDash([]);

  // start line (checkered)
  octx.save(); octx.translate(T.xs[0], T.ys[0]); octx.rotate(Math.atan2(T.dy[0], T.dx[0]));
  const cs = 10; for (let i = -C.HALF / cs; i < C.HALF / cs; i++) for (let j = 0; j < 2; j++) { octx.fillStyle = (i + j) % 2 ? '#111' : '#fff'; octx.fillRect(j * cs - cs, i * cs, cs, cs); }
  octx.restore();

  const view = Math.hypot(W, H) / scale;
  for (const t of trees) {
    if (Math.abs(t.x - camX) > view || Math.abs(t.y - camY) > view) continue;
    octx.fillStyle = '#2e6b2a'; octx.beginPath(); octx.arc(t.x, t.y, t.r, 0, 7); octx.fill();
    octx.fillStyle = '#3f8a38'; octx.beginPath(); octx.arc(t.x - t.r * .2, t.y - t.r * .2, t.r * .6, 0, 7); octx.fill();
  }

  boxes.forEach((b, i) => {
    if (!boxActive[i]) return;
    octx.save(); octx.translate(b.x, b.y); octx.rotate(clockT * 2 + i);
    const gr = octx.createLinearGradient(-9, -9, 9, 9); gr.addColorStop(0, '#ff5ad1'); gr.addColorStop(0.5, '#ffd23f'); gr.addColorStop(1, '#3fd2ff');
    octx.fillStyle = gr; octx.fillRect(-9, -9, 18, 18); octx.fillStyle = '#fff'; octx.font = 'bold 14px sans-serif'; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillText('?', 0, 1);
    octx.restore();
  });
  const labels = [];
  for (const b of bots) { drawKart(b, b.color, b.name, b.kt); labels.push([b, b.name, b.color]); }
  for (const r of remotes.values()) { drawKart(r, r.color, r.name, r.kt); labels.push([r, r.name, r.color]); }
  if (me) drawKart(me, mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], nick, kartType);

  // name tags in screen space
  const m = octx.getTransform();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.font = `800 ${13 * dpr}px system-ui,sans-serif`; octx.textAlign = 'center';
  for (const [k, name, color] of labels) {
    const sx = m.a * k.x + m.c * k.y + m.e, sy = m.b * k.x + m.d * k.y + m.f;
    if (sx < -50 || sy < -50 || sx > W + 50 || sy > H + 50) continue;
    octx.lineWidth = 3 * dpr; octx.strokeStyle = 'rgba(0,0,0,.7)'; octx.strokeText(name, sx, sy - 24 * dpr);
    octx.fillStyle = '#fff'; octx.fillText(name, sx, sy - 24 * dpr);
  }
}

function draw(dt) {
  clockT += dt;
  if (view === '2d') { draw2D(dt); return; }
  const list = [];
  for (const b of bots) list.push({ id: 'bot-' + b.name, k: b, color: b.color, name: b.name, type: b.kt });
  for (const [id, r] of remotes) list.push({ id: 'r-' + id, k: r, color: r.color, name: r.name, type: r.kt });
  if (me) { me.steer = (input.right ? 1 : 0) - (input.left ? 1 : 0); list.push({ id: 'me', k: me, color: mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], name: nick, me: true, type: kartType }); }
  R3D.syncKarts(list, clockT, dt);
  R3D.render(dt, me, boxActive, clockT, { lights: lightsState(), finished: !!(me && me.fin >= 0 && race && (inRace() || mode === 'solo')) });
  // 이름표
  const dpr = ov.width / innerWidth;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, innerWidth, innerHeight);
  // 속도선 (빠를 때)
  if (me && Math.abs(me.speed) > 470) {
    const k = Math.min(1, (Math.abs(me.speed) - 470) / 150), cx = innerWidth / 2, cy = innerHeight * 0.45;
    octx.strokeStyle = `rgba(255,255,255,${0.35 * k})`; octx.lineWidth = 2;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, r0 = Math.max(innerWidth, innerHeight) * (0.35 + Math.random() * 0.2), r1 = r0 + 60 + Math.random() * 120;
      octx.beginPath(); octx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); octx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); octx.stroke();
    }
  }
  octx.font = '800 13px system-ui,sans-serif'; octx.textAlign = 'center';
  for (const it of list) {
    if (it.me || !it.screen) continue;
    octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.7)'; octx.strokeText(it.name, it.screen.x, it.screen.y);
    octx.fillStyle = '#fff'; octx.fillText(it.name, it.screen.x, it.screen.y);
  }
}

function drawMini() {
  const S = mini.width, pad = 14, sc = Math.min((S - pad * 2) / (maxX - minX), (S - pad * 2) / (maxY - minY));
  const ox = (S - (maxX - minX) * sc) / 2 - minX * sc, oy = (S - (maxY - minY) * sc) / 2 - minY * sc;
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, S, S);
  mctx.setTransform(sc, 0, 0, sc, ox, oy);
  mctx.lineJoin = 'round'; mctx.strokeStyle = 'rgba(255,255,255,.85)'; mctx.lineWidth = 9 / sc; mctx.stroke(trackPath);
  const dot = (k, c, r) => { mctx.fillStyle = c; mctx.beginPath(); mctx.arc(k.x, k.y, r / sc, 0, 7); mctx.fill(); };
  for (const b of bots) dot(b, b.color, 6);
  for (const r of remotes.values()) dot(r, r.color, 6);
  if (me) { dot(me, '#000', 9); dot(me, mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], 7); }
}

// ---------- HUD ----------
function lightsState() {
  if (!race || !(inRace() || mode === 'solo')) return -1;
  const r = (race.start - now()) / 1000;
  if (r > 0) return Math.min(5, Math.max(1, Math.ceil((3.6 - r) / 0.65)));
  return r > -1 ? 6 : -1;
}
function updateHud() {
  SFX.update(me ? me.speed : 0, !!(me && me.drifting), !!(me && me.boost > 0), !!me);
  if (!me) return;
  const ls = lightsState();
  if (ls !== lastLights) { if (ls >= 1 && ls <= 5) SFX.beep(false); else if (ls === 6) SFX.beep(true); lastLights = ls; }
  if (me.boost > 0 && !(prevBoost > 0)) SFX.boost();
  prevBoost = me.boost;
  const dirDot = Math.cos(me.a) * T.dx[me.ti] + Math.sin(me.a) * T.dy[me.ti];
  wrongT = dirDot < -0.4 && Math.abs(me.speed) > 60 ? wrongT + 1 / 60 : 0;
  const list = racers(), t = race ? now() - race.start : 0;
  let info = '';
  if (race && (inRace() || mode === 'solo')) {
    const rank = list.findIndex((x) => x.me) + 1;
    info = `<div class="big">${rank}위 <span style="font-size:15px">/ ${list.length}</span></div>LAP ${Math.min(race.laps, Math.max(1, me.rl))}/${race.laps}<br>${fmt(me.fin >= 0 ? me.fin : t)}` + (bestLap != null ? `<br><span style="font-size:12px;font-weight:600">최고 랩 ${fmt(bestLap)}</span>` : '');
  } else if (mode === 'room') {
    info = race && !inRace() ? '관전 중<br><span style="font-weight:500">다음 레이스를 기다려요</span>' : '자유 주행<br><span style="font-weight:500">' + (isHost ? '🔗초대 링크를 보낸 뒤<br>이 화면으로 꼭 돌아오세요' : '방장을 기다려요') + '</span>';
  }
  $('info').innerHTML = info;

  let center = '', msg = '';
  if (race && (inRace() || mode === 'solo')) {
    if (t < 0) center = String(Math.ceil(-t / 1000));
    else if (t < 900) center = 'GO!';
    else if (me.fin >= 0) center = '';
  }
  if (wrongT > 0.8) msg = '⚠️ 역주행!'; else if (Date.now() < flashUntil) msg = flash; else if (me.boost > 0) msg = '부스터!';
  const ic = me.items || 0; $('icount').textContent = '부스터 ' + ic; $('bi').classList.toggle('empty', ic === 0);
  $('center').textContent = center;
  if (msg || !$('msg').textContent.startsWith('초대') && !$('msg').textContent.startsWith('http')) $('msg').textContent = msg;

  $('kmh').textContent = Math.round(Math.abs(me.speed) * 0.35);
  const ch = me.charge || 0;
  $('gfill').style.width = Math.min(100, ch / C.P.BIG * 100) + '%';
  $('gfill').style.background = ch >= C.P.BIG ? '#ff7a1a' : ch >= C.P.SMALL ? '#ffd23f' : '#aaa';

  const canStart = mode === 'room' && isHost && (!race || now() > race.start);
  $('startBtn').classList.toggle('hidden', !canStart);
  $('startBtn').textContent = race ? '다시 시작' : '레이스 시작';

  // results
  if (race && inRace() && me.fin >= 0) {
    const key = list.map((x) => x.name + x.fin).join('|');
    if (key !== resultsKey) { resultsKey = key; renderResults(list); }
    if (!showResults) { showResults = true; showPanel('results'); }
  }
}

function renderResults(list) {
  const myRank = list.findIndex((x) => x.me) + 1;
  let html = `<h2>🏁 ${myRank}위로 완주!</h2><ul class="res">`;
  list.forEach((x, i) => {
    html += `<li><span>${i + 1}</span><span class="dot" style="background:${x.color}"></span><span>${esc(x.name)}${x.me ? ' (나)' : ''}</span><span class="t">${x.fin >= 0 ? fmt(x.fin) : '달리는 중...'}</span></li>`;
  });
  html += '</ul>';
  if (mode === 'solo') html += '<button class="btn" id="againBtn">다시 하기</button>';
  else if (isHost) html += '<button class="btn" id="againBtn">다시 시작</button>';
  else html += '<div class="sub">방장이 다시 시작하면 자동으로 출발해요</div>';
  html += '<button class="btn gray" id="viewBtn">트랙 보기</button><button class="btn gray" id="outBtn">나가기</button>';
  $('results').innerHTML = html;
  const again = $('againBtn'); if (again) again.onclick = () => hostStart();
  $('viewBtn').onclick = () => showPanel(null);
  $('outBtn').onclick = () => leave();
}

// ---------- main loop ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (mode === 'room' && R) updateRoom();
  simulate(dt);
  if (mode === 'room') sendPresence(false);
  draw(dt); drawMini(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
