<!DOCTYPE html>
<html lang="ko">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #gl{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
  #ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .hidden{display:none!important}
  #hud{position:fixed;inset:0;pointer-events:none}
  #info{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.45);border-radius:12px;padding:8px 12px;font-weight:700;line-height:1.35;font-size:15px;min-width:120px}

  #mini{position:absolute;right:10px;top:56px;width:110px;height:110px;background:rgba(0,0,0,.35);border-radius:12px}
  #topbar{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center;pointer-events:auto}
  #roomtag{pointer-events:auto;background:rgba(0,0,0,.45);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
  .tbtn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;background:#ffd23f;color:#222}

  #startBtn{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:18px;padding:12px 22px;pointer-events:auto;box-shadow:0 4px 0 #b8860b}
  #center{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:84px;font-weight:900;color:#ffd23f;text-shadow:0 4px 0 #a2560a,0 0 20px rgba(0,0,0,.4)}
  #msg{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:22px;font-weight:800;text-shadow:0 2px 4px #000}
  #speed{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);text-align:center;font-weight:900;font-size:22px;text-shadow:0 2px 3px #000}
  #gauge{width:120px;height:10px;border-radius:5px;background:rgba(0,0,0,.5);margin:4px auto 0;overflow:hidden}
  #gfill{height:100%;width:0;background:#999}
  .ctl{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;pointer-events:auto;touch-action:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .ctl.on{background:rgba(255,210,63,.6)}
  #bl,#br{bottom:18px;width:84px;height:84px;font-size:30px}
  #bl{left:10px}#br{left:102px}
  #bd{right:12px;bottom:18px;width:100px;height:100px;font-size:17px}

    #speed{bottom:14px}
    #bi{right:124px;bottom:26px}
    #bb{right:206px;bottom:32px}
    #mini{width:96px;height:96px}
  }
  #panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,30,15,.55);padding:16px}
  .card{background:#fff;color:#222;border-radius:20px;padding:20px;width:min(380px,100%);box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:100%;overflow:auto}

  .card h2{margin:0 0 10px;font-size:22px;text-align:center}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:14px}
  .card input{width:100%;font-size:18px;padding:11px 12px;border-radius:12px;border:2px solid #ddd;margin-bottom:10px;text-align:center;user-select:text;-webkit-user-select:text}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:800;margin-bottom:9px;background:#ff5a3d;color:#fff}

  .row{display:flex;gap:8px}.row input{margin:0;flex:1}.row .btn{width:auto;margin:0;padding:0 16px}
  #status{text-align:center;font-size:13px;color:#c0392b;min-height:18px;margin-top:4px}

  #results{pointer-events:auto}

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const CORE = (() => {
  const CTRL = [[0,0],[800,0],[1100,150],[1150,450],[950,650],[700,600],[550,750],[600,1000],[400,1150],[100,1100],[-50,900],[150,700],[100,450],[-200,400],[-300,150]];
  const HALF = 75, WALL = 120, SPACING = 8, KART_R = 13;
  const P = { MAX: 430, ACC: 300, BRK: 600, REV: 150, BOOST: 640, TURN: 2.5, DRIFT_TURN: 3.4, GRIP: 9, DRIFT_GRIP: 2.0, SMALL: 0.6, BIG: 1.4 };

  function buildTrack() {
    const SC = 1.3, n = CTRL.length, dense = [];
    for (let i = 0; i < n; i++) {
      const g = (q) => [CTRL[q][0] * SC, CTRL[q][1] * SC]; const p0 = g((i - 1 + n) % n), p1 = g(i), p2 = g((i + 1) % n), p3 = g((i + 2) % n);
      for (let k = 0; k < 40; k++) {
        const t = k / 40, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    const M = dense.length, dc = [0];
    for (let i = 1; i <= M; i++) { const a = dense[i - 1], b = dense[i % M]; dc.push(dc[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
    const total = dc[M], N = Math.round(total / SPACING);
    const xs = new Float64Array(N), ys = new Float64Array(N);
    let j = 0;
    for (let k = 0; k < N; k++) {
      const s = k * total / N;
      while (dc[j + 1] < s) j++;
      const a = dense[j], b = dense[(j + 1) % M], t = (s - dc[j]) / (dc[j + 1] - dc[j]);
      xs[k] = a[0] + (b[0] - a[0]) * t; ys[k] = a[1] + (b[1] - a[1]) * t;
    }
    const dx = new Float64Array(N), dy = new Float64Array(N), seg = new Float64Array(N), cum = new Float64Array(N + 1);
    for (let k = 0; k < N; k++) {
      const m = (k + 1) % N, l = Math.hypot(xs[m] - xs[k], ys[m] - ys[k]);
      dx[k] = (xs[m] - xs[k]) / l; dy[k] = (ys[m] - ys[k]) / l; seg[k] = l; cum[k + 1] = cum[k] + l;
    }
    return { N, xs, ys, dx, dy, seg, cum, L: cum[N] };
  }

  function nearest(T, x, y, hint) {
    let best = Infinity, bi = 0, bt = 0;
    const scan = (i) => {
      const ax = T.xs[i], ay = T.ys[i], l = T.seg[i];
      let t = (x - ax) * T.dx[i] + (y - ay) * T.dy[i];
      t = t < 0 ? 0 : t > l ? l : t;
      const cx = ax + T.dx[i] * t, cy = ay + T.dy[i] * t, d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
      if (d < best) { best = d; bi = i; bt = t; }
    };
    if (hint < 0) for (let i = 0; i < T.N; i++) scan(i);
    else for (let o = -40; o <= 40; o++) scan((hint + o + T.N) % T.N);
    return { i: bi, s: T.cum[bi] + bt, cx: T.xs[bi] + T.dx[bi] * bt, cy: T.ys[bi] + T.dy[bi] * bt, dist: Math.sqrt(best) };
  }

  const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);

  function spawnPose(T, slot) {
    const back = 45 + Math.floor(slot / 2) * 50, lat = (slot % 2 ? 1 : -1) * 32;
    const dx = T.dx[0], dy = T.dy[0];
    return { x: T.xs[0] - dx * back - dy * lat, y: T.ys[0] - dy * back + dx * lat, a: Math.atan2(dy, dx) };
  }

  function resetKart(k, T, slot) {
    const p = spawnPose(T, slot);
    Object.assign(k, { x: p.x, y: p.y, a: p.a, vx: 0, vy: 0, speed: 0, drifting: false, charge: 0, boost: 0, off: false, rl: 0, fin: -1 });
    const n = nearest(T, k.x, k.y, -1); k.ti = n.i; k.s = n.s;
    return k;
  }
  const newKart = (T, slot) => resetKart({ maxMul: 1 }, T, slot);
  const progress = (k, T) => (k.rl - 1) * T.L + k.s;

  function stepKart(k, inp, dt, canDrive, T) {
    const steer = canDrive ? (inp.right ? 1 : 0) - (inp.left ? 1 : 0) : 0;
    const brake = canDrive && inp.brake, gas = canDrive && inp.gas && !brake;
    const wantDrift = canDrive && inp.drift && steer !== 0 && k.speed > 180;
    if (wantDrift) { k.drifting = true; k.charge += dt; }
    else {
      if (k.drifting) { if (k.charge >= P.BIG) k.boost = 1.5; else if (k.charge >= P.SMALL) k.boost = 0.8; }
      k.drifting = false; k.charge = 0;
    }
    const maxS = P.MAX * k.maxMul * (k.off ? 0.45 : 1);
    if (k.boost > 0) { k.boost -= dt; k.speed = approach(k.speed, P.BOOST * (k.off ? 0.6 : 1), P.ACC * 3 * dt); }
    else if (gas) k.speed = approach(k.speed, maxS, (k.speed > maxS ? P.ACC * 1.5 : P.ACC) * dt);
    else if (brake) k.speed = approach(k.speed, -P.REV, P.BRK * dt);
    else k.speed = approach(k.speed, 0, P.ACC * (k.off ? 1.2 : 0.5) * dt);

    const tf = Math.min(1, Math.abs(k.speed) / 120) * Math.sign(k.speed);
    k.a = wrapA(k.a + steer * (k.drifting ? P.DRIFT_TURN : P.TURN) * tf * dt);
    const f = 1 - Math.exp(-(k.drifting ? P.DRIFT_GRIP : P.GRIP) * dt);
    k.vx += (Math.cos(k.a) * k.speed - k.vx) * f;
    k.vy += (Math.sin(k.a) * k.speed - k.vy) * f;
    k.x += k.vx * dt; k.y += k.vy * dt;

    const n = nearest(T, k.x, k.y, k.ti);
    k.ti = n.i; k.off = n.dist > HALF;
    if (n.dist > WALL - KART_R) {
      const nx = (k.x - n.cx) / n.dist, ny = (k.y - n.cy) / n.dist, lim = WALL - KART_R;
      k.x = n.cx + nx * lim; k.y = n.cy + ny * lim;
      const vn = k.vx * nx + k.vy * ny;
      if (vn > 0) {
        k.vx -= vn * nx * 1.3; k.vy -= vn * ny * 1.3;
        if (k.speed > 0) k.speed = Math.max(0, k.speed - vn * 0.9);
        k.hit = vn;
      }
      k.speed *= 0.995;
    }
    const ds = n.s - k.s;
    if (ds < -T.L / 2) k.rl++; else if (ds > T.L / 2) k.rl--;
    k.s = n.s;
  }

  function collide(a, b, moveB) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = KART_R * 2;
    if (d >= min || d < 0.001) return false;
    const nx = dx / d, ny = dy / d, ov = min - d;
    if (moveB) { a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2; b.speed *= 0.97; }
    else { a.x -= nx * ov; a.y -= ny * ov; }
    a.speed *= 0.97;
    return true;
  }

  function botInput(k, T, lane) {
    const look = 8 + Math.floor(Math.abs(k.speed) / 35);
    const j = (k.ti + look) % T.N;
    const tx = T.xs[j] - T.dy[j] * lane, ty = T.ys[j] + T.dx[j] * lane;
    const diff = wrapA(Math.atan2(ty - k.y, tx - k.x) - k.a);
    const j2 = (k.ti + look + 18) % T.N;
    const turn = Math.abs(wrapA(Math.atan2(T.dy[j2], T.dx[j2]) - Math.atan2(T.dy[k.ti], T.dx[k.ti])));
    const slow = turn > 0.9 && k.speed > 330;
    return { left: diff < -0.04, right: diff > 0.04, gas: !slow, brake: turn > 1.4 && k.speed > 300, drift: false };
  }

  return { HALF, WALL, KART_R, P, buildTrack, nearest, wrapA, spawnPose, resetKart, newKart, progress, stepKart, collide, botInput };
})();
if (typeof module !== 'undefined') module.exports = CORE;
</script>
<script>
// P2P 연결 (PeerJS). 방장 폰이 서버 역할: 참가자 상태를 모아 모두에게 다시 뿌림
const NET = (() => {
  const PREFIX = 'kartracer4p-v1-';
  const num = (v) => (typeof v === 'number' && isFinite(v)) ? v : 0;
  function sanitize(p) {
    if (!p || typeof p !== 'object') return Object.freeze({});
    const o = {
      n: typeof p.n === 'string' ? p.n.slice(0, 12) : '?', jt: num(p.jt), host: p.host === true, sl: num(p.sl),
      x: num(p.x), y: num(p.y), a: num(p.a), sp: num(p.sp), dr: p.dr ? 1 : 0, bo: p.bo ? 1 : 0,
      rl: num(p.rl), s: num(p.s), fin: typeof p.fin === 'number' ? p.fin : -1, rid: typeof p.rid === 'string' ? p.rid.slice(0, 40) : null,
    };
    if (typeof p.hn === 'number') o.hn = p.hn;
    if (p.race && typeof p.race === 'object' && typeof p.race.id === 'string' && typeof p.race.start === 'number')
      o.race = { id: p.race.id.slice(0, 40), start: p.race.start, laps: Math.max(1, Math.min(9, num(p.race.laps) || 3)) };
    return Object.freeze(o);
  }

  const OPTS = { debug: 0, config: { iceServers: [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  ] } };

  function open(code, asHost, onClose, onStage) {
    onStage = onStage || (() => {});
    return new Promise((resolve, reject) => {
      onStage('연결 서버에 접속 중...');
      const peer = asHost ? new Peer(PREFIX + code, OPTS) : new Peer(OPTS);
      let peerOpened = false;
      const others = new Map(), conns = new Map();
      let mine = Object.freeze({}), mineAt = Date.now(), myId = 'me', hostConn = null, settled = false, closed = false;
      const fail = (msg) => { if (!settled) { settled = true; try { peer.destroy(); } catch (e) {} reject(new Error(msg)); } };
      const timer = setTimeout(() => fail(!peerOpened ? '연결 서버에 접속할 수 없어요. 인터넷 연결을 확인하세요'
        : '방장 폰과 직접 연결이 안 돼요. 둘 다 같은 와이파이에 연결해서 다시 해 보세요'), 20000);
      // 폰이 다른 앱(카톡 등)으로 갔다 오면 연결 서버와 끊기므로 자동으로 다시 붙음
      const revive = () => { try { if (!closed && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} };
      const onVis = () => { if (document.visibilityState === 'visible') revive(); };
      document.addEventListener('visibilitychange', onVis);
      const keep = setInterval(revive, 3000);
      peer.on('disconnected', () => setTimeout(revive, 500));
      const close = (msg) => { if (closed) return; closed = true; clearInterval(keep); document.removeEventListener('visibilitychange', onVis); try { peer.destroy(); } catch (e) {} if (settled) onClose(msg); };

      const api = {
        peers() {
          const list = [{ peer: myId, isMe: true, sameTab: true, kind: 'viewer', presence: mine, updatedAt: mineAt }];
          for (const [id, v] of others) list.push({ peer: id, isMe: false, sameTab: false, kind: 'viewer', presence: v.presence, updatedAt: v.updatedAt });
          return list;
        },
        async presence(patch) {
          const m = { ...mine };
          for (const k in patch) { if (patch[k] === null) delete m[k]; else m[k] = patch[k]; }
          mine = Object.freeze(m); mineAt = Date.now();
          if (asHost) {
            const list = [[myId, mine]];
            for (const [id, v] of others) list.push([id, v.presence]);
            for (const c of conns.values()) if (c.open) c.send({ t: 'w', list });
          } else if (hostConn && hostConn.open) hostConn.send({ t: 'st', p: mine });
        },
        async leave() { closed = true; clearInterval(keep); document.removeEventListener('visibilitychange', onVis); try { peer.destroy(); } catch (e) {} },
      };

      peer.on('error', (e) => {
        const t = e && e.type;
        if (settled) return; // 연결된 뒤의 서버 오류는 무시 (게임 데이터는 폰끼리 직접 오감)
        if (t === 'unavailable-id') fail('taken');
        else if (t === 'peer-unavailable') fail('방을 찾을 수 없어요. 코드가 맞는지, 방장이 게임 화면을 켜 두고 있는지 확인하세요');
        else if (t === 'browser-incompatible') fail('이 브라우저는 지원하지 않아요. 크롬이나 삼성 인터넷으로 열어 주세요');
        else fail('연결 실패 (' + (t || 'error') + ')');
      });

      if (asHost) {
        peer.on('open', (id) => { peerOpened = true; if (settled) return; myId = id; clearTimeout(timer); settled = true; resolve(api); });
        peer.on('connection', (conn) => {
          conn.on('open', () => {
            if (conns.size >= 3) { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 400); return; }
            conns.set(conn.peer, conn);
          });
          conn.on('data', (d) => { if (d && d.t === 'st' && conns.has(conn.peer)) others.set(conn.peer, { presence: sanitize(d.p), updatedAt: Date.now() }); });
          const drop = () => { conns.delete(conn.peer); others.delete(conn.peer); };
          conn.on('close', drop); conn.on('error', drop);
        });
      } else {
        peer.on('open', (id) => {
          peerOpened = true;
          if (hostConn) return; // 재접속 시 다시 연결하지 않음
          myId = id;
          onStage('방장 폰에 연결 중...');
          hostConn = peer.connect(PREFIX + code, { serialization: 'json' });
          hostConn.on('open', () => { clearTimeout(timer); settled = true; resolve(api); });
          hostConn.on('data', (d) => {
            if (!d || typeof d !== 'object') return;
            if (d.t === 'full') { fail('방이 가득 찼어요 (최대 4명)'); close('방이 가득 찼어요 (최대 4명)'); return; }
            if (d.t !== 'w' || !Array.isArray(d.list)) return;
            const seen = new Set(), t = Date.now();
            for (const item of d.list.slice(0, 4)) {
              if (!Array.isArray(item) || typeof item[0] !== 'string' || item[0] === myId) continue;
              seen.add(item[0]); others.set(item[0], { presence: sanitize(item[1]), updatedAt: t });
            }
            for (const k of [...others.keys()]) if (!seen.has(k)) others.delete(k);
          });
          hostConn.on('close', () => close('방장과 연결이 끊겼어요'));
          hostConn.on('error', () => close('방장과 연결이 끊겼어요'));
        });
      }
    });
  }
  return { open };
})();

<script>
// three.js 3D 화면. 물리는 2D(x,y) 그대로, 화면만 3D(x,z)로 그림
const R3D = (() => {
  const C = CORE;
  let T, renderer, scene, camera, karts = new Map(), boxes = [], camA = 0, camPos = null, t0 = 0;
  const v3 = new THREE.Vector3();

  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    t.anisotropy = 4;
    return t;
  }
  function noise(base, vary, dots) {
    return (g, w, h) => {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      for (let i = 0; i < dots; i++) { const v = (Math.random() - 0.5) * vary; g.fillStyle = `rgba(${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${Math.abs(v)})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    };
  }

  // 트랙 좌표 → 리본 메쉬
  function ribbon(inner, outer, y, colorFn, mat, uvScale) {
    const pos = [], col = [], uv = [], N = T.N;
    const P = (i, off) => { const j = i % N; return [T.xs[j] - T.dy[j] * off, T.ys[j] + T.dx[j] * off]; };
    for (let i = 0; i < N; i++) {
      const c = colorFn ? colorFn(i) : [1, 1, 1]; if (!c) continue;
      const a = P(i, inner), b = P(i, outer), cN = P(i + 1, inner), d = P(i + 1, outer);
      const u0 = T.cum[i] / (uvScale || 100), u1 = T.cum[i + 1] / (uvScale || 100);
      pos.push(a[0], y, a[1], b[0], y, b[1], d[0], y, d[1], a[0], y, a[1], d[0], y, d[1], cN[0], y, cN[1]);
      uv.push(u0, 0, u0, 1, u1, 1, u0, 0, u1, 1, u1, 0);
      for (let k = 0; k < 6; k++) col.push(c[0], c[1], c[2]);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); scene.add(m); return m;
  }
  function wall(off, height, colorFn) {
    const pos = [], col = [], N = T.N;
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      const ax = T.xs[i] - T.dy[i] * off, az = T.ys[i] + T.dx[i] * off, bx = T.xs[j] - T.dy[j] * off, bz = T.ys[j] + T.dx[j] * off;
      pos.push(ax, 0, az, bx, 0, bz, bx, height, bz, ax, 0, az, bx, height, bz, ax, height, az);
      const c = colorFn(i); for (let k = 0; k < 6; k++) col.push(c[0], c[1], c[2]);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  }

  function init(track, treeList, boxList) {
    T = track;
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.domElement.id = 'gl';
    document.body.insertBefore(renderer.domElement, document.body.firstChild);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd0ff);
    scene.fog = new THREE.Fog(0xbfe4ff, 700, 3200);
    camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 2, 6000);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8470, 0.85));
    const sun = new THREE.DirectionalLight(0xfff4e0, 0.75); sun.position.set(400, 800, 250); scene.add(sun);

    // 땅
    const grassTex = canvasTex(256, 256, noise('#4f9a3f', 0.35, 4000), [70, 70]);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), new THREE.MeshLambertMaterial({ map: grassTex }));
    ground.rotation.x = -Math.PI / 2; ground.position.set(500, -0.5, 600); scene.add(ground);

    // 도로, 연석, 모래, 중앙선
    const asphalt = canvasTex(256, 256, noise('#56585e', 0.28, 6000), null);
    asphalt.wrapS = asphalt.wrapT = THREE.RepeatWrapping;
    const H = C.HALF, Wl = C.WALL;
    ribbon(-H - 10, -Wl, 0.2, () => [0.86, 0.78, 0.55], new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    ribbon(H + 10, Wl, 0.2, () => [0.86, 0.78, 0.55], new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    ribbon(-H, H, 0.6, null, new THREE.MeshLambertMaterial({ map: asphalt, side: THREE.DoubleSide }), 140);
    const curb = (i) => Math.floor(i / 3) % 2 ? [0.9, 0.15, 0.12] : [1, 1, 1];
    ribbon(-H - 10, -H, 0.9, curb, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    ribbon(H, H + 10, 0.9, curb, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    ribbon(-1.5, 1.5, 0.8, (i) => (i % 8 < 4 ? [0.95, 0.95, 0.95] : null), new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    const tire = (i) => Math.floor(i / 2) % 2 ? [0.85, 0.12, 0.1] : [0.95, 0.95, 0.95];
    wall(Wl, 9, tire); wall(-Wl, 9, tire);

    // 출발선 + 아치
    const a0 = Math.atan2(T.dy[0], T.dx[0]);
    const checker = canvasTex(64, 256, (g, w, h) => { const s = 16; for (let x = 0; x < w / s; x++) for (let y = 0; y < h / s; y++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * s, y * s, s, s); } });
    const line = new THREE.Mesh(new THREE.PlaneGeometry(16, H * 2), new THREE.MeshLambertMaterial({ map: checker }));
    line.rotation.x = -Math.PI / 2; line.rotation.z = -a0; line.position.set(T.xs[0], 1.0, T.ys[0]); scene.add(line);
    const arch = new THREE.Group(); arch.position.set(T.xs[0], 0, T.ys[0]); arch.rotation.y = -a0; scene.add(arch);
    const red = new THREE.MeshLambertMaterial({ color: 0xe0352b });
    for (const z of [-(Wl + 6), Wl + 6]) { const p = new THREE.Mesh(new THREE.BoxGeometry(8, 70, 8), red); p.position.set(0, 35, z); arch.add(p); }
    const bannerTex = canvasTex(1024, 128, (g, w, h) => { g.fillStyle = '#e0352b'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = 'bold 84px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🏁 KART RACER 🏁', w / 2, h / 2 + 4); });
    const banner = new THREE.Mesh(new THREE.BoxGeometry(6, 22, (Wl + 10) * 2), [red, red, red, red, new THREE.MeshLambertMaterial({ map: bannerTex }), new THREE.MeshLambertMaterial({ map: bannerTex })]);
    banner.position.set(0, 72, 0); banner.rotation.y = Math.PI / 2; banner.rotation.y = 0;
    // 배너 글씨가 진행 방향(앞/뒤)에서 보이도록: x축 면에 텍스처
    banner.material = [new THREE.MeshLambertMaterial({ map: bannerTex }), new THREE.MeshLambertMaterial({ map: bannerTex }), red, red, red, red];
    bannerTex.center.set(0.5, 0.5);
    arch.add(banner);

    // 나무 (인스턴싱)
    const crownG = new THREE.ConeGeometry(1, 2.4, 7), trunkG = new THREE.CylinderGeometry(0.18, 0.22, 0.8, 6);
    const crowns = new THREE.InstancedMesh(crownG, new THREE.MeshLambertMaterial({ color: 0x2f7a30 }), treeList.length);
    const trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: 0x7a5230 }), treeList.length);
    const d = new THREE.Object3D();
    treeList.forEach((t, i) => {
      d.position.set(t.x, t.r * 0.8 + t.r * 1.2, t.y); d.scale.set(t.r, t.r, t.r); d.rotation.set(0, i, 0); d.updateMatrix(); crowns.setMatrixAt(i, d.matrix);
      d.position.set(t.x, t.r * 0.4, t.y); d.updateMatrix(); trunks.setMatrixAt(i, d.matrix);
    });
    scene.add(crowns, trunks);

    // 먼 산
    const mtnMat = new THREE.MeshLambertMaterial({ color: 0x6f9a78, flatShading: true });
    for (let i = 0; i < 18; i++) {
      const ang = i / 18 * Math.PI * 2, r = 3200 + (i % 3) * 300, hgt = 500 + ((i * 37) % 5) * 120;
      const m = new THREE.Mesh(new THREE.ConeGeometry(hgt * 1.3, hgt, 6), mtnMat);
      m.position.set(500 + Math.cos(ang) * r, hgt / 2 - 20, 600 + Math.sin(ang) * r); scene.add(m);
    }

    // 아이템 상자
    const qTex = canvasTex(64, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#ff5ad1'); gr.addColorStop(0.5, '#ffd23f'); gr.addColorStop(1, '#3fd2ff'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = 'bold 48px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', w / 2, h / 2 + 2); });
    const boxMat = new THREE.MeshLambertMaterial({ map: qTex, transparent: true, opacity: 0.9, emissive: 0x333333 });
    const boxG = new THREE.BoxGeometry(14, 14, 14);
    boxes = boxList.map((b) => { const m = new THREE.Mesh(boxG, boxMat); m.position.set(b.x, 14, b.y); scene.add(m); return m; });

    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  }

  function makeKart(color) {
    const g = new THREE.Group();

    const dark = new THREE.MeshLambertMaterial({ color: 0x1c1c1c });

    add(new THREE.BoxGeometry(30, 6, 18), paint, 0, 7, 0);
    add(new THREE.BoxGeometry(12, 4, 14), paint, 18, 6, 0);
    add(new THREE.BoxGeometry(4, 2, 22), dark, 23, 4, 0);
    add(new THREE.BoxGeometry(3, 8, 3), dark, -14, 12, 0);
    add(new THREE.BoxGeometry(5, 2, 22), paint, -15, 16, 0);
    add(new THREE.BoxGeometry(8, 8, 12), dark, -6, 12, 0);
    add(new THREE.SphereGeometry(5, 12, 10), new THREE.MeshLambertMaterial({ color: 0xffd9b8 }), -3, 20, 0);
    const helmet = add(new THREE.SphereGeometry(5.6, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2), paint, -3, 21, 0);
    helmet.rotation.z = 0.5;
    add(new THREE.BoxGeometry(2, 2, 10), dark, 6, 13, 0);
    const wheelG = new THREE.CylinderGeometry(5, 5, 5, 12); wheelG.rotateX(Math.PI / 2);
    for (const [x, z] of [[11, 10.5], [11, -10.5], [-11, 11.5], [-11, -11.5]]) add(wheelG, dark, x, 5, z, g);
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(20, 16), new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: 0.28, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.95; shadow.scale.set(1.2, 0.8, 1); g.add(shadow);
    const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffd23f });
    const sparks = [-11.5, 11.5].map((z) => add(new THREE.SphereGeometry(2.5, 6, 5), sparkMat, -16, 3, z, g));
    const flameG = new THREE.ConeGeometry(4, 22, 10); flameG.rotateZ(Math.PI / 2);
    const flame = add(flameG, new THREE.MeshBasicMaterial({ color: 0x66d0ff, transparent: true, opacity: 0.85 }), -26, 9, 0, g);
    scene.add(g);
    return { g, body, sparks, sparkMat, flame };
  }

  function syncKarts(list, time) {
    const seen = new Set();
    for (const it of list) {
      seen.add(it.id);
      let v = karts.get(it.id);
      if (!v || v.color !== it.color) { if (v) scene.remove(v.g); v = makeKart(it.color); v.color = it.color; karts.set(it.id, v); }
      const k = it.k;
      v.g.position.set(k.x, 0, k.y);
      v.g.rotation.y = -k.a;
      const sp = Math.min(1, Math.abs(k.speed || 0) / 400);
      v.body.position.y = Math.sin(time * 40 + it.id.length) * 0.35 * sp;
      v.body.rotation.x = k.drifting ? 0.06 * (k.steer || 1) : 0;
      const ch = k.charge || 0;
      v.sparkMat.color.setHex(ch >= C.P.BIG ? 0xff7a1a : ch >= C.P.SMALL ? 0xffd23f : 0xdddddd);
      for (const s of v.sparks) { s.visible = !!k.drifting; s.scale.setScalar(0.6 + Math.random() * 0.8); }
      v.flame.visible = (k.boost || 0) > 0;
      v.flame.scale.set(0.8 + Math.random() * 0.5, 1, 1);

    }
    for (const [id, v] of karts) if (!seen.has(id)) { scene.remove(v.g); karts.delete(id); }
  }

  function project(x, y, z) {
    v3.set(x, y, z).project(camera);
    if (v3.z > 1) return null;
    return { x: (v3.x + 1) / 2 * innerWidth, y: (1 - v3.y) / 2 * innerHeight };
  }

  function render(dt, focus, boxActive, time) {
    if (focus) {
      camA += C.wrapA(focus.a - camA) * (1 - Math.exp(-7 * dt));

      if (!camPos || camPos.distanceTo(want) > 400) camPos = want.clone();
      camPos.lerp(want, 1 - Math.exp(-10 * dt));
      camera.position.copy(camPos);
      camera.lookAt(focus.x + fx * 60, 6, focus.y + fz * 60);
      const fov = (portrait ? 74 : 60) + Math.max(0, Math.min(1, (Math.abs(focus.speed) - 300) / 340)) * 16;
      camera.fov += (fov - camera.fov) * (1 - Math.exp(-4 * dt)); camera.updateProjectionMatrix();
    } else {
      t0 += dt * 0.12;
      camera.position.set(500 + Math.cos(t0) * 1300, 520, 650 + Math.sin(t0) * 1300);
      camera.lookAt(500, 0, 650); camPos = null;
      if (camera.fov !== 62) { camera.fov = 62; camera.updateProjectionMatrix(); }
    }
    boxes.forEach((m, i) => { m.visible = boxActive[i]; m.rotation.y = time * 1.5 + i; m.rotation.x = time * 0.7; m.position.y = 14 + Math.sin(time * 3 + i) * 2; });
    renderer.render(scene, camera);
  }

  return { init, syncKarts, render };
})();

(() => {

function startSolo() {
  getNick(); mode = 'solo';
  me = C.newKart(T, 0);
  bots = [1, 2, 3].map((s, i) => { const k = C.newKart(T, s); k.baseMul = [0.97, 0.94, 0.91][i]; k.lane = [22, -18, 8][i]; k.name = ['토끼봇', '거북봇', '여우봇'][i]; k.color = COLORS[s]; return k; });
  newSoloRace();
  enterGameUI();
}
function newSoloRace() {
  race = { id: 's' + Date.now(), start: Date.now() + 3500, laps: LAPS };
  C.resetKart(me, T, 0); bots.forEach((b, i) => C.resetKart(b, T, i + 1));
  me.items = 0; boxes.forEach((b, i) => { boxActive[i] = true; b.back = 0; });
  myRaceId = race.id; showResults = false; resultsKey = ''; showPanel(null);
}

async function enterRoom(code, host) {
  getNick();
  $('createBtn').disabled = $('joinBtn').disabled = true;
  $('status').textContent = '연결 중...';
  const onClose = (m) => { leave(); $('status').textContent = m; };
  try {
    for (let tries = 0; ; tries++) {
      try { R = await NET.open(code, host, onClose, (m) => { $('status').textContent = m; }); break; }
      catch (e) { if (host && e.message === 'taken' && tries < 4) { code = String(Math.floor(1000 + Math.random() * 9000)); continue; } throw e; }
    }
  } catch (e) {
    $('status').textContent = e.message === 'taken' ? '방 만들기 실패. 다시 시도하세요' : e.message;
    $('createBtn').disabled = $('joinBtn').disabled = false; return;
  }
  mode = 'room'; roomCode = code; isHost = host; joinTime = Date.now();
  hostOffset = 0; offsetMax = -Infinity; hostPeerId = null; lastHostPres = null;
  race = null; myRaceId = null; seenRaceId = null; remotes.clear();
  me = C.newKart(T, 0); mySlot = -1; placed = false;
  $('status').textContent = '';
  await R.presence({ n: nick, jt: joinTime, host: host }).catch(() => {});
  enterGameUI();
}

function checkFull() {
  if (mode !== 'room' || !R) return;
  const list = roster();
  const idx = list.findIndex((p) => p.isMe && p.sameTab);
  if (idx >= 4) { leave(); $('status').textContent = '방이 가득 찼어요 (최대 4명)'; }
}

function enterGameUI() {
  $('hud').classList.remove('hidden');
  const room = mode === 'room';
  $('roomtag').classList.toggle('hidden', !room);
  $('mini').style.top = '58px';
  showPanel(null);
}

function leave() {
  if (R) { const r = R; R = null; r.leave().catch(() => {}); }
  mode = 'menu'; me = null; bots = []; race = null; remotes.clear(); isHost = false;
  $('hud').classList.add('hidden'); $('startBtn').classList.add('hidden');
  $('createBtn').disabled = $('joinBtn').disabled = !roomNs;
  showPanel('menu');
}

// ---------- room helpers ----------
function roster() {
  if (!R) return [];
  return R.peers().filter((p) => p.presence && typeof p.presence.n === 'string' && p.kind === 'viewer')
    .slice().sort((a, b) => (+a.presence.jt || 0) - (+b.presence.jt || 0) || (a.peer < b.peer ? -1 : 1));
}

function hostStart() {
  if (mode === 'solo') { newSoloRace(); return; }
  if (!isHost) return;
  race = { id: 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1000), start: Date.now() + 4000, laps: LAPS };
  sendPresence(true);
}

function sendPresence(force) {
  if (!R || !me) return;
  const t = Date.now();
  if (!force && t - lastSend < SEND_MS) return;
  lastSend = t;
  const p = { n: nick, jt: joinTime, host: isHost, sl: mySlot,
    x: Math.round(me.x), y: Math.round(me.y), a: Math.round(me.a * 100) / 100, sp: Math.round(me.speed),
    dr: me.drifting ? 1 : 0, bo: me.boost > 0 ? 1 : 0,
    rl: me.rl, s: Math.round(me.s), fin: me.fin >= 0 ? Math.round(me.fin) : -1, rid: myRaceId };
  if (isHost) { p.hn = t; p.race = race; } else { p.hn = null; p.race = null; }
  R.presence(p).catch(() => {});
}

function updateRoom() {
  const list = roster();
  const self = list.find((p) => p.isMe && p.sameTab);
  mySlot = self ? Math.min(3, list.indexOf(self)) : 0;
  if (self && !placed) { placed = true; C.resetKart(me, T, mySlot); }

  // host election: earliest joiner among those claiming host, else earliest joiner
  const host = list.find((p) => p.presence.host) || null;

  if (isHost) { hostOffset = 0; }
  else if (host) {
    if (host.peer !== hostPeerId) { hostPeerId = host.peer; offsetMax = -Infinity; lastHostPres = null; }
    if (host.presence !== lastHostPres && typeof host.presence.hn === 'number') {
      lastHostPres = host.presence;
      offsetMax = Math.max(offsetMax, host.presence.hn - host.updatedAt);
      hostOffset = offsetMax;
    }
    const r = host.presence.race;
    race = r && typeof r.id === 'string' && typeof r.start === 'number' ? r : race;
  }

  // a new race was announced
  if (race && race.id !== seenRaceId) {
    seenRaceId = race.id;
    if (now() < race.start + 500 && mySlot < 4) {
      myRaceId = race.id; C.resetKart(me, T, mySlot); me.items = 0; showResults = false; resultsKey = ''; showPanel(null);
    } else myRaceId = null;
  }

  // remote karts
  const seen = new Set();
  list.forEach((p, idx) => {
    if (p.isMe && p.sameTab) return;
    const q = p.presence; if (typeof q.x !== 'number') return;
    seen.add(p.peer);
    let r = remotes.get(p.peer);
    if (!r) { r = { x: q.x, y: q.y, a: q.a, pres: null }; remotes.set(p.peer, r); }
    if (r.pres !== q) { r.pres = q; r.recv = Date.now(); }
    r.color = COLORS[Math.min(idx, 3)]; r.name = clean(q.n) || '?';
  });
  for (const k of remotes.keys()) if (!seen.has(k)) remotes.delete(k);
  $('roomtag').textContent = '방 ' + roomCode + ' · ' + Math.min(list.length, 4) + '/4명 · 🔗초대';
}

// ---------- standings ----------
function racers() {
  const out = [];
  if (!me) return out;
  if (mode === 'solo') {
    out.push({ name: nick, color: COLORS[0], prog: C.progress(me, T), fin: me.fin, me: true });
    bots.forEach((b) => out.push({ name: b.name, color: b.color, prog: C.progress(b, T), fin: b.fin }));
  } else if (race) {
    if (myRaceId === race.id) out.push({ name: nick, color: COLORS[mySlot], prog: C.progress(me, T), fin: me.fin, me: true });
    for (const r of remotes.values()) {
      const q = r.pres; if (!q || q.rid !== race.id) continue;
      out.push({ name: r.name, color: r.color, prog: ((+q.rl || 0) - 1) * T.L + (+q.s || 0), fin: typeof q.fin === 'number' ? q.fin : -1 });
    }
  }
  out.sort((a, b) => (a.fin >= 0 && b.fin >= 0) ? a.fin - b.fin : (a.fin >= 0 ? -1 : b.fin >= 0 ? 1 : b.prog - a.prog));
  return out;
}

// ---------- simulation ----------
function inRace() { return race && myRaceId === race.id; }
function canDrive(k) {
  if (!race) return true;
  if (k === me && !inRace()) return true;
  return now() >= race.start && k.fin < 0;
}

function catchUp(dt) {
  const racing = race && now() >= race.start;
  const all = [];
  if (me) all.push(me);
  for (const b of bots) all.push(b);
  const remoteKs = [...remotes.values()];
  // 뒤처질수록 최고속도 보정 (최대 +14%)
  let lead = -Infinity;
  if (racing) {
    for (const x of racers()) if (x.fin < 0) lead = Math.max(lead, x.prog);
  }
  for (const k of all) {
    const base = k.baseMul || 1;
    const inIt = k === me ? inRace() : true;
    if (racing && inIt && k.fin < 0 && lead > -Infinity) {
      const gap = Math.max(0, lead - C.progress(k, T));
      k.maxMul = base * (1 + Math.min(1, gap / 1600) * 0.14);
    } else k.maxMul = base;
    // 슬립스트림: 앞 카트 바로 뒤를 1초 따라가면 부스터
    let behind = false;
    if (k.speed > 250) {
      const fx = Math.cos(k.a), fy = Math.sin(k.a);
      for (const o of all.concat(remoteKs)) {
        if (o === k) continue;
        const dx = o.x - k.x, dy = o.y - k.y, d = Math.hypot(dx, dy);
        if (d > 28 && d < 170 && (dx * fx + dy * fy) / d > 0.96) { behind = true; break; }
      }
    }
    k.draft = behind ? (k.draft || 0) + dt : Math.max(0, (k.draft || 0) - dt * 2);
    if (k.draft >= 1.0) { k.draft = 0; k.boost = Math.max(k.boost, 0.9); if (k === me) flashMsg('💨 슬립스트림!'); }
  }
  // 아이템 상자
  const t = Date.now();
  boxes.forEach((b, i) => {
    if (!boxActive[i]) { if (t > b.back) boxActive[i] = true; return; }
    if (me && Math.hypot(me.x - b.x, me.y - b.y) < 24) {
      boxActive[i] = false; b.back = t + 3000;
      if ((me.items || 0) < 2) { me.items = (me.items || 0) + 1; flashMsg('🚀 부스터 획득!'); }
    }
    for (const bt of bots) if (boxActive[i] && Math.hypot(bt.x - b.x, bt.y - b.y) < 24) { boxActive[i] = false; b.back = t + 3000; bt.boost = Math.max(bt.boost, 1.0); }
  });
}

function simulate(dt) {
  if (!me) return;
  catchUp(dt);
  const steps = Math.min(12, Math.ceil(dt / STEP)), h = dt / steps;
  for (let s = 0; s < steps; s++) {
    C.stepKart(me, input, h, canDrive(me), T);
    for (const b of bots) C.stepKart(b, C.botInput(b, T, b.lane), h, canDrive(b), T);
    for (const b of bots) C.collide(me, b, true);
    for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) C.collide(bots[i], bots[j], true);
    for (const r of remotes.values()) C.collide(me, r, false);
  }
  if (race && now() >= race.start) {
    const t = now() - race.start;
    if (inRace() && me.fin < 0 && C.progress(me, T) >= race.laps * T.L) { me.fin = t; sendPresence(true); }
    for (const b of bots) if (b.fin < 0 && C.progress(b, T) >= race.laps * T.L) b.fin = t;
  }
  // remote display smoothing with short extrapolation
  const k = 1 - Math.exp(-14 * dt);
  for (const r of remotes.values()) {
    const q = r.pres; const age = Math.min(0.25, (Date.now() - r.recv) / 1000);
    const tx = q.x + Math.cos(q.a) * q.sp * age, ty = q.y + Math.sin(q.a) * q.sp * age;
    if (Math.hypot(tx - r.x, ty - r.y) > 300) { r.x = tx; r.y = ty; r.a = q.a; }
    r.x += (tx - r.x) * k; r.y += (ty - r.y) * k; r.a += C.wrapA(q.a - r.a) * k;
    r.drifting = !!q.dr; r.boost = q.bo ? 1 : 0;
  }
}

// ---------- rendering ----------
function resizeOv() { const dpr = Math.min(2, devicePixelRatio || 1); ov.width = Math.round(innerWidth * dpr); ov.height = Math.round(innerHeight * dpr); }
addEventListener('resize', resizeOv); resizeOv();

function setView(v) {
  view = v; try { localStorage.setItem('kart-view', v); } catch (e) {}
  const gl = document.getElementById('gl'); if (gl) gl.style.visibility = v === '3d' ? 'visible' : 'hidden';
  $('viewBtn2').textContent = v === '3d' ? '2D로' : '3D로'; $('viewMenu').textContent = '화면: ' + (v === '3d' ? '3D' : '2D') + ' (눌러서 바꾸기)';
}
$('viewBtn2').onclick = () => setView(view === '3d' ? '2d' : '3d');
$('viewMenu').onclick = () => setView(view === '3d' ? '2d' : '3d');
setView(view);

function drawKart(k, color, name) {
  octx.save(); octx.translate(k.x, k.y); octx.rotate(k.a);
  if (k.boost > 0) { octx.fillStyle = 'rgba(80,180,255,.8)'; octx.beginPath(); octx.moveTo(-17, -6); octx.lineTo(-34 - Math.random() * 10, 0); octx.lineTo(-17, 6); octx.fill(); }
  if (k.drifting) { octx.fillStyle = (k.charge || 0) >= C.P.BIG ? '#ff7a1a' : (k.charge || 0) >= C.P.SMALL ? '#ffd23f' : '#ddd';
    for (const y of [-11, 11]) { octx.beginPath(); octx.arc(-15 - Math.random() * 6, y, 3 + Math.random() * 2, 0, 7); octx.fill(); } }
  octx.fillStyle = 'rgba(0,0,0,.25)'; octx.fillRect(-15, -11, 34, 24);
  octx.fillStyle = '#1c1c1c';
  for (const [x, y] of [[-10, -12], [-10, 8], [8, -11], [8, 7]]) octx.fillRect(x, y, 8, 4);
  octx.fillStyle = color; octx.beginPath(); octx.roundRect ? octx.roundRect(-16, -9, 33, 18, 6) : octx.rect(-16, -9, 33, 18); octx.fill();
  octx.fillStyle = 'rgba(255,255,255,.35)'; octx.fillRect(6, -6, 9, 12);
  octx.fillStyle = '#ffe0c2'; octx.beginPath(); octx.arc(-3, 0, 6.5, 0, 7); octx.fill();
  octx.fillStyle = color; octx.beginPath(); octx.arc(-4, 0, 6.5, Math.PI * 0.5, Math.PI * 1.5); octx.fill();
  octx.restore();
}

function draw2D(dt) {
  const W = ov.width, H = ov.height, dpr = W / innerWidth;
  const scale = Math.min(innerWidth, innerHeight) / 540 * dpr;
  let tx, ty, ta;
  if (me) { tx = me.x; ty = me.y; ta = me.a; }
  else { menuT += dt * 0.15; tx = (minX + maxX) / 2 + Math.cos(menuT) * 300; ty = (minY + maxY) / 2 + Math.sin(menuT) * 300; ta = menuT + Math.PI / 2; }
  const kk = 1 - Math.exp(-5 * dt);
  camA += C.wrapA(ta - camA) * kk; camX = tx; camY = ty;

  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = '#4c9a45'; octx.fillRect(0, 0, W, H);
  octx.setTransform(1, 0, 0, 1, W / 2, H * (me ? 0.66 : 0.5));
  octx.scale(scale, scale); octx.rotate(-camA - Math.PI / 2); octx.translate(-camX, -camY);

  octx.lineJoin = 'round'; octx.lineCap = 'round';
  octx.strokeStyle = '#2a2a2a'; octx.lineWidth = C.WALL * 2 + 16; octx.stroke(trackPath);
  octx.strokeStyle = '#d9c38a'; octx.lineWidth = C.WALL * 2; octx.stroke(trackPath);
  octx.strokeStyle = '#fff'; octx.lineWidth = C.HALF * 2 + 14; octx.stroke(trackPath);
  octx.setLineDash([24, 24]); octx.strokeStyle = '#e0352b'; octx.stroke(trackPath); octx.setLineDash([]);
  octx.strokeStyle = '#5b5d63'; octx.lineWidth = C.HALF * 2; octx.stroke(trackPath);
  octx.setLineDash([30, 40]); octx.strokeStyle = 'rgba(255,255,255,.35)'; octx.lineWidth = 3; octx.stroke(trackPath); octx.setLineDash([]);

  // start line (checkered)
  octx.save(); octx.translate(T.xs[0], T.ys[0]); octx.rotate(Math.atan2(T.dy[0], T.dx[0]));
  const cs = 10; for (let i = -C.HALF / cs; i < C.HALF / cs; i++) for (let j = 0; j < 2; j++) { octx.fillStyle = (i + j) % 2 ? '#111' : '#fff'; octx.fillRect(j * cs - cs, i * cs, cs, cs); }
  octx.restore();

  const view = Math.hypot(W, H) / scale;
  for (const t of trees) {
    if (Math.abs(t.x - camX) > view || Math.abs(t.y - camY) > view) continue;
    octx.fillStyle = '#2e6b2a'; octx.beginPath(); octx.arc(t.x, t.y, t.r, 0, 7); octx.fill();
    octx.fillStyle = '#3f8a38'; octx.beginPath(); octx.arc(t.x - t.r * .2, t.y - t.r * .2, t.r * .6, 0, 7); octx.fill();
  }

  boxes.forEach((b, i) => {
    if (!boxActive[i]) return;
    octx.save(); octx.translate(b.x, b.y); octx.rotate(clockT * 2 + i);
    const gr = octx.createLinearGradient(-9, -9, 9, 9); gr.addColorStop(0, '#ff5ad1'); gr.addColorStop(0.5, '#ffd23f'); gr.addColorStop(1, '#3fd2ff');
    octx.fillStyle = gr; octx.fillRect(-9, -9, 18, 18); octx.fillStyle = '#fff'; octx.font = 'bold 14px sans-serif'; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillText('?', 0, 1);
    octx.restore();
  });
  const labels = [];
  for (const b of bots) { drawKart(b, b.color, b.name); labels.push([b, b.name, b.color]); }
  for (const r of remotes.values()) { drawKart(r, r.color, r.name); labels.push([r, r.name, r.color]); }
  if (me) drawKart(me, mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], nick);

  // name tags in screen space
  const m = octx.getTransform();
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.font = `800 ${13 * dpr}px system-ui,sans-serif`; octx.textAlign = 'center';
  for (const [k, name, color] of labels) {
    const sx = m.a * k.x + m.c * k.y + m.e, sy = m.b * k.x + m.d * k.y + m.f;
    if (sx < -50 || sy < -50 || sx > W + 50 || sy > H + 50) continue;
    octx.lineWidth = 3 * dpr; octx.strokeStyle = 'rgba(0,0,0,.7)'; octx.strokeText(name, sx, sy - 24 * dpr);
    octx.fillStyle = '#fff'; octx.fillText(name, sx, sy - 24 * dpr);
  }
}

function draw(dt) {
  clockT += dt;
  if (view === '2d') { draw2D(dt); return; }
  const list = [];
  for (const b of bots) list.push({ id: 'bot-' + b.name, k: b, color: b.color, name: b.name });
  for (const [id, r] of remotes) list.push({ id: 'r-' + id, k: r, color: r.color, name: r.name });
  if (me) { me.steer = (input.right ? 1 : 0) - (input.left ? 1 : 0); list.push({ id: 'me', k: me, color: mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], name: nick, me: true }); }
  R3D.syncKarts(list, clockT);
  R3D.render(dt, me, boxActive, clockT);
  // 이름표
  const dpr = ov.width / innerWidth;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, innerWidth, innerHeight);
  octx.font = '800 13px system-ui,sans-serif'; octx.textAlign = 'center';
  for (const it of list) {
    if (it.me || !it.screen) continue;
    octx.lineWidth = 3; octx.strokeStyle = 'rgba(0,0,0,.7)'; octx.strokeText(it.name, it.screen.x, it.screen.y);
    octx.fillStyle = '#fff'; octx.fillText(it.name, it.screen.x, it.screen.y);
  }
}

function drawMini() {
  const S = mini.width, pad = 14, sc = Math.min((S - pad * 2) / (maxX - minX), (S - pad * 2) / (maxY - minY));
  const ox = (S - (maxX - minX) * sc) / 2 - minX * sc, oy = (S - (maxY - minY) * sc) / 2 - minY * sc;
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.clearRect(0, 0, S, S);
  mctx.setTransform(sc, 0, 0, sc, ox, oy);
  mctx.lineJoin = 'round'; mctx.strokeStyle = 'rgba(255,255,255,.85)'; mctx.lineWidth = 9 / sc; mctx.stroke(trackPath);
  const dot = (k, c, r) => { mctx.fillStyle = c; mctx.beginPath(); mctx.arc(k.x, k.y, r / sc, 0, 7); mctx.fill(); };
  for (const b of bots) dot(b, b.color, 6);
  for (const r of remotes.values()) dot(r, r.color, 6);
  if (me) { dot(me, '#000', 9); dot(me, mode === 'room' ? COLORS[Math.max(0, mySlot)] : COLORS[0], 7); }
}

// ---------- HUD ----------
function updateHud() {
  if (!me) return;
  const list = racers(), t = race ? now() - race.start : 0;
  let info = '';
  if (race && (inRace() || mode === 'solo')) {
    const rank = list.findIndex((x) => x.me) + 1;
    info = `<div class="big">${rank}위 <span style="font-size:15px">/ ${list.length}</span></div>LAP ${Math.min(race.laps, Math.max(1, me.rl))}/${race.laps}<br>${fmt(me.fin >= 0 ? me.fin : t)}`;
  } else if (mode === 'room') {
    info = race && !inRace() ? '관전 중<br><span style="font-weight:500">다음 레이스를 기다려요</span>' : '자유 주행<br><span style="font-weight:500">' + (isHost ? '🔗초대 링크를 보낸 뒤<br>이 화면으로 꼭 돌아오세요' : '방장을 기다려요') + '</span>';
  }
  $('info').innerHTML = info;

  let center = '', msg = '';
  if (race && (inRace() || mode === 'solo')) {
    if (t < 0) center = String(Math.ceil(-t / 1000));
    else if (t < 900) center = 'GO!';
    else if (me.fin >= 0) center = '';
  }
  if (Date.now() < flashUntil) msg = flash; else if (me.boost > 0) msg = '부스터!';
  const ic = me.items || 0; $('icount').textContent = '부스터 ' + ic; $('bi').classList.toggle('empty', ic === 0);
  $('center').textContent = center;
  if (msg || !$('msg').textContent.startsWith('초대') && !$('msg').textContent.startsWith('http')) $('msg').textContent = msg;

  $('kmh').textContent = Math.round(Math.abs(me.speed) * 0.35);
  const ch = me.charge || 0;
  $('gfill').style.width = Math.min(100, ch / C.P.BIG * 100) + '%';
  $('gfill').style.background = ch >= C.P.BIG ? '#ff7a1a' : ch >= C.P.SMALL ? '#ffd23f' : '#aaa';

  const canStart = mode === 'room' && isHost && (!race || now() > race.start);
  $('startBtn').classList.toggle('hidden', !canStart);
  $('startBtn').textContent = race ? '다시 시작' : '레이스 시작';

  // results
  if (race && inRace() && me.fin >= 0) {
    const key = list.map((x) => x.name + x.fin).join('|');
    if (key !== resultsKey) { resultsKey = key; renderResults(list); }
    if (!showResults) { showResults = true; showPanel('results'); }
  }
}

function renderResults(list) {
  const myRank = list.findIndex((x) => x.me) + 1;
  let html = `<h2>🏁 ${myRank}위로 완주!</h2><ul class="res">`;
  list.forEach((x, i) => {
    html += `<li><span>${i + 1}</span><span class="dot" style="background:${x.color}"></span><span>${esc(x.name)}${x.me ? ' (나)' : ''}</span><span class="t">${x.fin >= 0 ? fmt(x.fin) : '달리는 중...'}</span></li>`;
  });
  html += '</ul>';
  if (mode === 'solo') html += '<button class="btn" id="againBtn">다시 하기</button>';
  else if (isHost) html += '<button class="btn" id="againBtn">다시 시작</button>';
  else html += '<div class="sub">방장이 다시 시작하면 자동으로 출발해요</div>';
  html += '<button class="btn gray" id="viewBtn">트랙 보기</button><button class="btn gray" id="outBtn">나가기</button>';
  $('results').innerHTML = html;
  const again = $('againBtn'); if (again) again.onclick = () => hostStart();
  $('viewBtn').onclick = () => showPanel(null);
  $('outBtn').onclick = () => leave();
}

// ---------- main loop ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (mode === 'room' && R) updateRoom();
  simulate(dt);
  if (mode === 'room') sendPresence(false);
  draw(dt); drawMini(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
